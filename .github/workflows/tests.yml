name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract (nur Linux – dort läuft der Durchlauf mit echter Texterkennung)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - run: pip install -e .[dev]
      - run: pytest -v -o faulthandler_timeout=300
        timeout-minutes: 15
        env:
          PYTHONIOENCODING: utf-8
