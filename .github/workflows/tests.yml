name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # aus release.yml: vor jedem Release
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract (nur Linux – dort läuft der Durchlauf mit echter Texterkennung)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      # epubcheck (W3C) prüft die E-Books, die das Programm schreibt (#59) – nur unter Linux, einmal genügt
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - name: epubcheck
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK=$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: pytest -v -o faulthandler_timeout=300
        timeout-minutes: 15
        env:
          PYTHONIOENCODING: utf-8
