name: Installer bauen

# Baut die fertigen Programme: Windows-Installer, portables ZIP, je ein DMG
# für Apple Silicon und Intel sowie AppImage und tar.gz für Linux (x86_64).
# Bei einem Versions-Tag (v*, angelegt mit »python scripts/release.py 0.12.0«)
# laufen zusätzlich alle Tests; sind sie und die Rauchtests grün, veröffentlicht
# der letzte Auftrag das Release mit dem Abschnitt aus dem CHANGELOG und prüft,
# dass die Dauerlinks im README (releases/latest/download/…) auf die neue
# Version zeigen. Ein Tag mit Bindestrich (v1.0.0-rc1) wird Vorabversion und
# ändert die Dauerlinks nicht.
# »Run workflow« (workflow_dispatch) baut nur zum Prüfen – mit dem Haken
# »nur_linux« nur den Linux-Teil (schneller, keine Mac-Minuten).
#
# Ohne Secrets entsteht ein unsignierter Mac-Build (Gatekeeper warnt dann beim
# ersten Start). Für signierte und notarisierte Builds werden gebraucht:
#   MACOS_CERTIFICATE_P12        das »Developer ID Application«-Zertifikat als .p12, base64-kodiert
#   MACOS_CERTIFICATE_PASSWORD   das Passwort dieser .p12-Datei
#   MACOS_CODESIGN_IDENTITY      z. B. "Developer ID Application: Vorname Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD   für die Notarisierung
# Siehe RELEASE.md, »Einmalig: Apple-Signatur einrichten«.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      nur_linux:
        description: "Nur den Linux-Build (AppImage, tar.gz) bauen"
        type: boolean
        default: false

jobs:
  pruefen:
    # Passen Tag, pyproject.toml und CHANGELOG zusammen? Sonst gar nicht erst bauen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, Versionsnummer und CHANGELOG prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --notes "$TAG" >> "$GITHUB_STEP_SUMMARY"

  tests:
    # Dieselben Tests wie bei jedem Push, damit kein Release mit rotem Stand erscheint
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/tests.yml

  windows:
    needs: pruefen
    if: ${{ !inputs.nur_linux }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Tesseract und Inno Setup installieren
        # Tesseract wird mitgeliefert (nur die .exe und ihre DLLs); die Modelle
        # frak2021 und deu lädt scripts/models.py.
        run: |
          choco install tesseract --no-progress -y
          choco install innosetup --no-progress -y

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Tesseract-Laufzeit bündeln
        run: python scripts\prepare_tesseract.py

      - name: PyInstaller
        run: pyinstaller fraktur_korrektor.spec --clean --noconfirm

      - name: Rauchtest der gepackten App
        run: python scripts\smoke_test.py "dist\Fraktur-Korrektor\Fraktur-Korrektor.exe"

      - name: Installer bauen (Inno Setup)
        run: python scripts\build_installer.py

      - name: Portables ZIP erstellen
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Copy-Item LICENSE dist\Fraktur-Korrektor\LICENSE.txt
          Compress-Archive -Path dist\Fraktur-Korrektor -DestinationPath "dist\installer\Fraktur-Korrektor-v$version-win64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/installer/Fraktur-Korrektor_Setup.exe
            dist/installer/Fraktur-Korrektor-v*-win64.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            arch: arm64
          - os: macos-15-intel    # Intel-Macs
            arch: x86_64
    needs: pruefen
    if: ${{ !inputs.nur_linux }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Tesseract installieren
        # Nur als Quelle für das Bündeln; die Modelle kommen aus scripts/models.py,
        # darum ohne das große Paket tesseract-lang.
        run: brew install tesseract

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Signatur-Zertifikat in einen Wegwerf-Schlüsselbund laden
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Bauen (App und DMG, mit Secrets signiert und notarisiert)
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/installer/Fraktur-Korrektor-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    # Absichtlich die älteste noch angebotene Ubuntu-Version: Das Programm braucht auf dem Zielrechner
    # mindestens die glibc des Build-Rechners (22.04: glibc 2.35, also Ubuntu 22.04+, Debian 12+, Fedora 36+).
    # Tesseract wird nicht mitgeliefert, sondern kommt beim Benutzer aus dem Paketmanager; hier ist es nur
    # für den Rauchtest installiert.
    needs: pruefen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Tesseract für den Rauchtest
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python -c "import tkinter" || echo "::warning::tkinter fehlt - das AppImage bekommt kein Fenster zum Beenden (Konsole)"

      - name: PyInstaller
        run: pyinstaller fraktur_korrektor.spec --clean --noconfirm

      - name: Rauchtest des PyInstaller-Ordners
        run: python scripts/smoke_test.py dist/Fraktur-Korrektor/Fraktur-Korrektor

      - name: AppImage und tar.gz packen
        run: scripts/build_appimage.sh

      - name: Rauchtest des AppImage (ohne FUSE, entpackt)
        run: python scripts/smoke_test.py dist/installer/Fraktur-Korrektor-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/installer/Fraktur-Korrektor-linux-x86_64.AppImage
            dist/installer/Fraktur-Korrektor-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pruefen, tests, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VORAB: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Text des Releases aus dem CHANGELOG
        run: python3 scripts/release.py --notes "$TAG" > notes.md

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          name: Fraktur-Korrektor ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ env.VORAB }}
          make_latest: ${{ env.VORAB == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: assets/**/*

      - name: Dauerlinks prüfen
        # README und Hilfe verlinken releases/latest/download/<fester Name>: Jeder muss jetzt auf diese Version
        # zeigen und sich herunterladen lassen. Dieselbe Liste steht in scripts/release.py (DOWNLOADS).
        if: env.VORAB != 'true'
        run: |
          sleep 10
          for f in Fraktur-Korrektor_Setup.exe Fraktur-Korrektor-macos-arm64.dmg \
                   Fraktur-Korrektor-macos-x86_64.dmg Fraktur-Korrektor-linux-x86_64.AppImage; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f"
            ziel=$(curl -sS -o /dev/null -w '%{redirect_url}' "$url")
            case "$ziel" in
              */releases/download/$TAG/$f) ;;
              *) echo "::error::$url zeigt auf »$ziel« statt auf $TAG"; exit 1 ;;
            esac
            curl -fsSL -r 0-0 -o /dev/null "$url" || { echo "::error::$f lässt sich nicht herunterladen"; exit 1; }
            echo "ok  $f"
          done
