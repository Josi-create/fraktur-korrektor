<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fraktur-Korrektor</title>
<style>
html,body{height:100%}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#e9e6df;color:#222;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;gap:14px;align-items:center;padding:6px 12px;background:#2b2b2b;color:#eee;font-size:14px;flex:none}
#top select{font-size:14px}
#mode{padding:2px 10px;border-radius:10px;font-weight:bold;background:#3a6;color:#fff}
#mode.fix{background:#c33}
#mode.free{background:#c80}
#pos{color:#ccc;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title{max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top>*{flex-shrink:0} #top>#pos,#top>#title{flex-shrink:1}
#top a{color:#ddd}
#top .langsw b{color:#fff}
/* Suchen und Gehe-zu: Eingabezeile und Fundstellen-Widget in der Kopfleiste */
#qbar{display:none;gap:6px;align-items:center} #qbar.on{display:flex}
#qbar input{font-size:14px;padding:2px 6px;width:210px;border-radius:3px;border:1px solid #888}
#find{display:none;gap:8px;align-items:center;background:#454545;border-radius:12px;padding:2px 6px 2px 10px} #find.on{display:flex}
#find button{font:13px Segoe UI,Arial,sans-serif;padding:1px 9px;border:1px solid #888;border-radius:9px;background:#333;color:#eee;cursor:pointer}
#find button:hover{background:#5a5a5a} #find b{color:#fff;min-width:44px;text-align:center}
.found{background:#9fdcff;border-radius:2px;outline:2px solid #1780c0}
#loading{position:absolute;inset:0;z-index:9;background:#e9e6df;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:0 15%;text-align:center;font-size:18px;line-height:1.6;color:#555}
#lprog{width:min(520px,90%);height:16px} #lpage{font-size:15px;color:#777}
#main{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:10px;padding:10px;min-height:0}
.pane{background:#fff;border:1px solid #bbb;border-radius:4px;position:relative;overflow:hidden;min-height:0}
#noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:#666}
#noimg p{max-width:360px;line-height:1.6;margin:0}
#noimg button{font:15px Segoe UI,Arial,sans-serif;padding:10px 20px;border:1px solid #285;border-radius:4px;background:#3a6;color:#fff;cursor:pointer}
#noimg button:hover{background:#395}
#imgwrap{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .18s ease-out}
#imgwrap img{display:block;position:absolute}
.hl{position:absolute;pointer-events:none;box-sizing:border-box}
#hlLine{background:rgba(255,220,60,.28)}
#hlWord,#hlWord2{border:solid red}
#right{display:flex;flex-direction:column;gap:10px;min-height:0}
/* Wort und Tastaturhilfe über beide Spalten: nimmt links dem Bild etwas Höhe, gibt sie rechts dem Text (#55) */
#korr{grid-column:1 / -1;padding:10px 12px;min-height:118px;overflow:visible}
#word{font-size:19px;margin-bottom:6px}
#word b{color:#c00}
/* Eingabefelder liegen im Textfenster genau über der Lesezeile (und der Folgezeile bei getrennten Wörtern) */
#edit,#edit2{position:absolute;left:21px;right:21px;z-index:3;margin:0;padding:0 5px;box-sizing:border-box;border:2px solid #c33;border-radius:3px;background:#fffbe6;color:#000;font-family:Georgia,'Times New Roman',serif;font-size:19px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#edit2{border-color:#c60}
#korr{min-height:78px}
#help{color:#666;font-size:13.5px;line-height:1.7}
kbd{background:#eee;border:1px solid #bbb;border-bottom-width:2px;border-radius:3px;padding:0 5px;font-family:Consolas,monospace;font-size:12.5px;color:#222}
#text{flex:1}
#lines{position:absolute;left:0;right:0;top:0;padding:0 22px;transition:transform .18s ease-out;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.65}
#lines div{white-space:pre-wrap;border-radius:3px;padding:0 6px;color:#555}
#lines div.cur{background:#fff3b8;color:#000}
#lines div.head{color:#aaa;font-size:14px;font-family:Segoe UI,Arial,sans-serif}
#lines div.sep{border-top:1px solid #999;height:0;margin:10px 0;padding:0}
#lines div.fn{font-size:16px}
#lines div.pgsep{text-align:center;color:#999;font:13px Segoe UI,Arial,sans-serif;letter-spacing:1px;margin:18px 0 10px 0;white-space:nowrap;overflow:hidden}
.flag{background:#f99;border-radius:2px}
.auto{background:#fc8;border-radius:2px}
.curflag{outline:2px solid #c00}
/* Auszeichnung im Text (XHTML wie im EPUB) wird nicht gezeigt, sondern dargestellt: Tabellen als Gitter – jede Zelle ist
   weiterhin eine Zeile (Lesecursor, Klick, Eingabefeld) –, Überschriften groß, <em>/<sup> … als Schrift */
#lines .tblgrid{display:grid;width:max-content;max-width:100%;margin:8px 0 8px 6px;padding:0;border-radius:0;border-top:1px solid #8ab;border-left:1px solid #8ab;white-space:normal}
#lines .tblgrid > div{border-right:1px solid #8ab;border-bottom:1px solid #8ab;border-radius:0;padding:1px 12px;color:#333;white-space:pre-wrap}
#lines .tblgrid > div.thcell{font-weight:bold;background:#eaf2fb}
#lines .tblgrid > div.cur{background:#fff3b8;color:#000}
#lines .tblgrid > div.blank{display:none}
#lines div.tsel{background:#d6eaff !important;color:#000}
#lines div.hd1{font-size:27px;font-weight:bold;color:#222} #lines div.hd2{font-size:23px;font-weight:bold;color:#222} #lines div.hd3{font-size:20px;font-weight:bold;color:#222}
#tprev{border-collapse:collapse;font:14px Georgia,serif;margin-top:6px;color:#222} #tprev td,#tprev th{border:1px solid #9bc;padding:1px 9px} #tprev th{background:#e3eefa}
#centerline{position:absolute;left:0;width:5px;top:25%;height:30px;margin-top:-15px;background:#c90;border-radius:0 3px 3px 0}
#shint{margin-top:6px;font-size:14.5px;color:#a40}
#serie{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#serie.on{display:flex}
#shead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
#shead input{font-family:Consolas,monospace;font-size:18px;padding:4px 6px;width:220px}
#sinfo{margin-left:14px;color:#a40}
#slist{flex:1;overflow:auto}
.srow{display:flex;align-items:center;gap:14px;padding:3px 10px;border-bottom:1px solid #eee;border-left:6px solid transparent}
.srow.sel{background:#fff3b8;border-left-color:#c90}
.srow.off{opacity:.35}
.srow .chk{font-size:20px;width:22px;flex:none}
.srow .pgno{color:#888;font-size:13px;width:70px;flex:none}
.crop{flex:none;position:relative;overflow:hidden;background-repeat:no-repeat;border:1px solid #ddd;background-color:#f4f4f4}
.crop i{position:absolute;border:2px solid red;box-sizing:border-box}
.stext{font-family:Georgia,serif;font-size:16px;white-space:pre-wrap}
#wlist{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#wlist.on{display:flex}
#dics{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#dics.on{display:flex}
#dhead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
#dbody{padding:18px 22px;max-width:760px;font-size:16px;line-height:1.5}
#dbody label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid #ccc;border-radius:5px;margin-bottom:8px;cursor:pointer}
#dbody label:hover{background:#faf8f2} #dbody input{margin-top:6px;transform:scale(1.3)} #dbody small{display:block;color:#666;font-size:14px}
#dyear{color:#555;margin-bottom:12px} #dinfo{margin-top:14px;color:#a40;min-height:24px}
#whead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
#whead input{font-family:Consolas,monospace;font-size:17px;padding:4px 6px;width:220px}
#wgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,230px);grid-auto-rows:30px;gap:2px 8px;padding:10px 14px;align-content:start}
.wl{font-family:Georgia,serif;font-size:16px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.wl:hover{background:#f3f3f3}
.wl.sel{background:#fff3b8;border-color:#c90}
.wl.gone{text-decoration:line-through;color:#c33;background:#fdeaea}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div id="top">
 <a href="/bibliothek" data-t="library"></a>
 <b id="title">Fraktur-Korrektor</b>
 <label><span data-t="page"></span> <select id="pagesel"></select></label>
 <span id="mode"></span>
 <span id="pos"></span>
 <span id="qbar"><span id="qlabel"></span><input id="qinp" type="text" spellcheck="false"></span>
 <span id="find"><span id="findq"></span><button type="button" id="fprev"></button><b id="findn"></b><button type="button" id="fnext"></button><button type="button" id="fclose" data-t-title="find_close">×</button></span>
 <a href="#" id="diclink" data-t="dic_link"></a>
 <a href="#" id="addTrans" data-t="act_trans" style="display:none"></a>
 <a href="#" id="addImg" data-t="act_images" style="display:none"></a>
 <a id="helplink" data-help="usage" target="_blank" data-t="help_f1"></a>
 <span class="langsw"></span>
</div>
<div id="main">
 <div id="loading"><div data-t="loading"></div><progress id="lprog" max="1" value="0" style="display:none"></progress><div id="lpage"></div></div>
 <div class="pane" id="korr">
  <div id="word"></div>
  <div id="help"></div>
  <div id="shint"></div>
 </div>
 <div class="pane" id="imgpane">
  <div id="imgwrap"><div class="hl" id="hlLine"></div><div class="hl" id="hlWord"></div><div class="hl" id="hlWord2"></div></div>
  <div id="noimg" style="display:none"><p data-t="noimg_text"></p><button type="button" id="noimgBtn" data-t="noimg_btn"></button></div>
 </div>
 <div id="right">
  <div class="pane" id="text"><div id="centerline"></div><div id="lines"></div>
   <input id="edit" type="text" spellcheck="false" style="display:none">
   <input id="edit2" type="text" spellcheck="false" style="display:none" data-t-title="edit2_title">
  </div>
 </div>
 <div id="dics">
  <div id="dhead"><span data-t="dic_head"></span>
   <div style="color:#666;font-size:13.5px;margin-top:6px" data-t="dic_help"></div></div>
  <div id="dbody">
   <div id="dyear"></div>
   <label><input type="checkbox" value="vor1901"><span><b data-t="dic_vor1901"></b><small data-t="dic_vor1901_ex"></small></span></label>
   <label><input type="checkbox" value="1901"><span><b data-t="dic_1901"></b><small data-t="dic_1901_ex"></small></span></label>
   <label><input type="checkbox" value="neu"><span><b data-t="dic_neu"></b><small data-t="dic_neu_ex"></small></span></label>
   <div id="dinfo"></div>
  </div>
 </div>
 <div id="wlist">
  <div id="whead"><span data-t="wl_head"></span> <input id="wfilter" spellcheck="false" data-t-ph="filter"><span id="winfo" style="margin-left:14px;color:#a40"></span>
   <div style="color:#666;font-size:13.5px;margin-top:6px" data-t="wl_help"></div>
  </div>
  <div id="wgrid"></div>
 </div>
 <div id="serie">
  <div id="shead"><span data-t="ser_head"></span> <input id="sOld" spellcheck="false" data-t-ph="ser_word"> → <input id="sNew" spellcheck="false" data-t-ph="ser_new"><span id="sinfo"></span>
   <div id="shelp" style="color:#666;font-size:13.5px;margin-top:6px" data-t="ser_help"></div>
  </div>
  <div id="slist"></div>
 </div>
</div>
<script>
const $ = id => document.getElementById(id);
const BASE = (location.pathname.match(/^\/buch\/[0-9a-f]+/) || [''])[0];  // jedes Buch hat seine eigene Adresse
applyI18n();
let ov = [], pg = null, data = null, li = 0, mode = 'read', cf = null, passed = null, busy = false, lastCy = null;
let zoom = 1; try { zoom = parseFloat(localStorage.getItem('zoom')) || 1; } catch (e) {}
let prevD = null, nextD = null, nbEls = {}, wheelAcc = 0;
let imgEls = {}, imgState = null, imgKeep = null;  // Seitenbilder im Stapel, letzte Lage des Stapels, beim Seitenwechsel: das bisherige Bild festhalten
const IMG_GAP = 60;  // Abstand zwischen den Seitenbildern, in Bildpixeln
const NOTRANS = location.search.includes('notrans');
let lineEls = [], bmTimer = null, pending = null, msg = '', ser = null;
let hits = null, hi = -1, ask = null;  // Suche: Fundstellen im ganzen Buch, die aktuelle, offene Eingabezeile (find | goto)
const WRE = /^[A-Za-zÄÖÜäöüß]+/;
const READ_POS = 0.25;  // Lesezeile bei 1/4 der Fensterhöhe (Text und Bild)
if (NOTRANS) { $('imgwrap').style.transition = 'none'; $('lines').style.transition = 'none'; }  // für Screenshots/Tests

const HELP = { read: t('help_read'), fix: t('help_fix'), free: t('help_free'), table: t('help_table') };

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
// Auszeichnung: dieselben Elemente wie der Server (korrlib.MARKUP)
const TAGS = 'table|tr|td|th|h[1-6]|em|strong|i|b|sup|sub|p|blockquote|br';
const TAGRE = new RegExp('</?(?:' + TAGS + ')\\s*/?>', 'g'), TAGESC = new RegExp('&lt;(/?(?:' + TAGS + ')\\s*/?)>', 'g');
function strip(s) { return s.replace(TAGRE, ''); }
function vis(l, pos) { return strip(l.slice(0, pos)).length; }  // Zeichenposition ohne die Auszeichnung davor – für die Lage im Bild
// Anzeige ohne Steuerzeichen: Schrift-Auszeichnung wird echte Schrift, Struktur (Tabelle, Überschrift) macht die Gestaltung
const INLINE = /^\/?(?:em|strong|i|b|sup|sub)$/;
function fmt(s) { return esc(s).replace(TAGESC, (m, g) => INLINE.test(g.trim()) ? '<' + g.trim() + '>' : ''); }
// Zeichenposition im angezeigten Text -> Position in der Zeile (mit Auszeichnung)
function rawPos(l, v) {
  let skipped = 0;
  for (const m of l.matchAll(TAGRE)) { if (v < m.index - skipped) break; skipped += m[0].length; }
  return v + skipped;
}
// Für das Eingabefeld: Struktur-Auszeichnung am Zeilenanfang und -ende bleibt unsichtbar und wird beim Speichern wieder angefügt
const STRUCT = '(?:</?(?:table|tr|td|th|h[1-6]|p|blockquote)>)*';
function parts(l) { const m = l.match(new RegExp('^(' + STRUCT + ')([\\s\\S]*?)(' + STRUCT + ')$')); return { pre: m[1], core: m[2], post: m[3] }; }
let ed = { pre: '', post: '' }, ed2 = { pre: '', post: '' };
function isJoin(f) { return f && f.word.indexOf('¬') >= 0; }
function part2len(f) { return f.word.length - f.len - 1; }
function skippable(i) { const l = data.lines[i]; return l.trim() === '' || l === '---'; }

async function loadOverview() {
  // Beim ersten Öffnen prüft der Server jedes Wort – der Balken zeigt, wie weit er ist. Ein schnelles Öffnen zeigt ihn gar nicht.
  const tick = setInterval(async () => {
    try { const p = await (await fetch(BASE + '/api/progress')).json(); if (p.done >= p.total) return;
      $('lprog').max = p.total; $('lprog').value = p.done; $('lprog').style.display = ''; $('lpage').textContent = t('loading_page', { n: p.done, total: p.total }); } catch (e) {}
  }, 300);
  let o; try { o = await (await fetch(BASE + '/api/overview')).json(); } finally { clearInterval(tick); }
  ov = o.pages;
  $('title').textContent = o.title; document.title = o.title + ' – Fraktur-Korrektor'; $('loading').style.display = 'none';
  // Was dem Buch noch fehlt, lässt sich von hier aus nachlegen – der Dialog dafür steht in der Bibliothek
  if (o.local && o.id) {
    const weiter = was => ev => { ev.preventDefault(); location.href = '/bibliothek#edit=' + o.id + '|' + was; };
    $('addTrans').style.display = ''; $('addTrans').onclick = weiter('trans');
    if (!o.images) {
      $('addImg').style.display = ''; $('addImg').onclick = weiter('images');
      $('noimg').style.display = 'flex'; $('noimgBtn').onclick = weiter('images');
    }
  }
  const s = $('pagesel'); s.innerHTML = '';
  for (const p of ov) { const op = document.createElement('option'); op.value = p.page; op.textContent = p.page + ' (' + p.n + ')'; s.appendChild(op); }
  if (pg) s.value = pg;
}
function updateCount() {
  const o = ov.find(o => o.page == pg); if (!o) return; o.n = data.flags.length;
  const op = [...$('pagesel').options].find(x => x.value == pg); if (op) op.textContent = pg + ' (' + o.n + ')';
}
async function fetchPage(p) { try { const r = await fetch(BASE + '/api/page/' + p); return r.ok ? await r.json() : null; } catch (e) { return null; } }
async function loadPage(p, line, smooth) {
  const old = smooth && pg ? { p: pg, i: li } : null;
  const r = await fetch(BASE + '/api/page/' + p); if (!r.ok) return false;
  const d = await r.json();
  const idx = ov.findIndex(o => o.page == p);
  [prevD, nextD] = await Promise.all([idx > 0 ? fetchPage(ov[idx - 1].page) : null, idx >= 0 && idx < ov.length - 1 ? fetchPage(ov[idx + 1].page) : null]);
  data = d; pg = p; $('pagesel').value = p; lastCy = null; passed = null; cf = null; mode = 'read';
  li = line == 'last' ? data.lines.length - 1 : Math.min(Math.max(0, line || 0), data.lines.length - 1);
  if (line == 'last') { while (li > 0 && skippable(li)) li--; }
  else { while (li < data.lines.length - 1 && (skippable(li) || (!line && data.lines[li].startsWith('#')))) li++; }
  updateCount(); renderText();
  // fließender Seitenwechsel: erst unsichtbar auf die alte Lesezeile (jetzt in der Nachbarseite) setzen, dann weich zur neuen
  const oe = old && nbEls[old.p] ? nbEls[old.p][old.i] : null;
  if (oe) { const L = $('lines'); L.style.transition = 'none'; L.style.transform = 'translateY(' + ($('text').clientHeight * READ_POS - (oe.offsetTop + oe.offsetHeight / 2)) + 'px)'; L.offsetHeight; if (!NOTRANS) L.style.transition = ''; }
  imgKeep = old ? { pg: old.p, state: imgState } : null;  // links dasselbe: das bisherige Bild bleibt erst stehen, dann rollt es weiter
  render();
  return true;
}

function mark(i, b) {
  b = b || data;
  const l = b.lines[i];
  const fs = b.flags.filter(f => f.line == i).map(f => ({ s: f.start, n: f.len, k: f.kind, c: f === cf }));
  for (const f of b.flags) if (isJoin(f) && f.line + 1 == i) fs.push({ s: f.start2 || 0, n: part2len(f), k: f.kind, c: f === cf });
  const h = curHit();
  if (h && h.page == b.page && (h.line == i || (h.join && h.line + 1 == i))) {
    const s = h.line == i ? h.start : h.start2, n = h.line == i ? h.len : h.len2;
    if (!fs.some(f => s < f.s + f.n && f.s < s + n)) fs.push({ s, n, k: 'found' });
  }
  fs.sort((a, b) => b.s - a.s);
  let parts = [], last = l.length;
  for (const f of fs) {
    parts.unshift(fmt(l.slice(f.s + f.n, last)));
    parts.unshift('<span class="' + (f.k == 'auto' ? 'auto' : f.k == 'found' ? 'found' : 'flag') + (f.c ? ' curflag' : '') + '">' + esc(l.slice(f.s, f.s + f.n)) + '</span>');
    last = f.s;
  }
  parts.unshift(fmt(l.slice(0, last)));
  return parts.join('') || ' ';
}
function decorate(els, b) {
  // Tabellenzeilen und Überschriften kenntlich machen
  let inT = false;
  b.lines.forEach((l, i) => {
    const d = els[i]; if (!d) return;
    if (l.includes('<table>')) inT = true;
    d.classList.toggle('intable', inT); d.classList.toggle('thcell', inT && l.includes('<th>'));
    if (l.includes('</table>')) inT = false;
    const m = l.match(/^<h([1-6])>/);
    for (const n of [1, 2, 3]) d.classList.toggle('hd' + n, !!m && Math.min(3, +m[1]) == n);
  });
}
function renderText() {
  const box = $('lines'); box.innerHTML = ''; lineEls = []; nbEls = {};
  for (const b of [prevD, data, nextD]) {
    if (!b) continue;
    const ps = document.createElement('div'); ps.className = 'pgsep'; ps.textContent = '―――――――――――  ' + t('page') + ' ' + b.page + '  ―――――――――――'; box.appendChild(ps);
    let fn = false, grid = null; const els = [];
    b.lines.forEach((l, i) => {
      const d = document.createElement('div'); d.dataset.p = b.page; d.dataset.i = i;
      if (l === '---') { d.className = 'sep'; fn = true; grid = null; }
      else { d.innerHTML = mark(i, b); if (l.startsWith('#') && i == 0) d.className = 'head'; else if (fn) d.className = 'fn'; }
      if (l.includes('<table>') && l !== '---') {  // Tabelle: die folgenden Zeilen sind Zellen eines Gitters
        let first = ''; for (let k = i; k < b.lines.length && !first.includes('</tr>'); k++) first += b.lines[k];
        grid = document.createElement('div'); grid.className = 'tblgrid';
        grid.style.gridTemplateColumns = 'repeat(' + Math.max(1, (first.split('</tr>')[0].match(/<t[dh]>/g) || []).length) + ', auto)';
        box.appendChild(grid);
      }
      (grid || box).appendChild(d); els.push(d);
      if (grid && !l.trim()) d.classList.add('blank');

    render(); return;
  }
  tb = { a: li, b: li, cols: 2, head: false }; mode = 'table'; msg = ''; pending = null; render();
}
async function tbKey(e) {
  const k = e.key;
  if (k == 'Escape') { li = tb.a; tb = null; mode = 'read'; }
  else if (k == 'ArrowDown' || k == 'j') { if (tb.b + 1 < data.lines.length && data.lines[tb.b + 1] != '---') li = ++tb.b; }
  else if (k == 'ArrowUp' || k == 'k') { if (tb.b > tb.a) li = --tb.b; }
  else if (/^[1-9]$/.test(k)) tb.cols = +k;
  else if (k == 'h' || k == 'H') tb.head = !tb.head;
  else if (k == 'Enter') {
    const x = tb, n = tbCells().length; tb = null; mode = 'read'; li = x.a;
    if (await markup({ kind: 'table', start: x.a, end: x.b, cols: x.cols, head: x.head, old: data.lines.slice(x.a, x.b + 1) }))
      msg = t('tbl_done', { r: Math.ceil(n / x.cols), c: x.cols });
    bookmark();
  } else return;
  e.preventDefault(); render();
}
// ---- Zeile teilen / verbinden: Die Texterkennung übersieht manchmal einen Zeilenwechsel (dann verrutschen z. B. Tabellenspalten)
// oder macht einen zu viel. Der Server teilt bzw. vereinigt den Bildausschnitt mit – die Bildzuordnung bleibt.
async function splitLine() {
  const line = mode == 'fix' ? cf.line : li, e1 = $('edit');
  const r = await fetch(BASE + '/api/lines/' + pg, { method: 'POST', body: JSON.stringify({ kind: 'split', line, old: data.lines[line], text: ed.pre + e1.value + ed.post, pos: ed.pre.length + e1.selectionStart }) });
  if (r.status == 400) { $('shint').textContent = t('split_where'); return; }  // am Rand oder mitten in der Auszeichnung: im Feld bleiben
  if (!r.ok) { alert(t('conflict')); await loadPage(pg, line); return; }
  data = await r.json(); updateCount(); renderText(); pending = null; msg = t('split_done'); toRead(line);
}
async function joinLine() {
  if (!plainLine(li) || li + 1 >= data.lines.length || data.lines[li + 1] == '---') { msg = t('join_no'); render(); return; }
  const r = await fetch(BASE + '/api/lines/' + pg, { method: 'POST', body: JSON.stringify({ kind: 'join', line: li, old: data.lines.slice(li, li + 2) }) });
  if (!r.ok) { await loadPage(pg, li); msg = t('changed_outside'); render(); return; }
  data = await r.json(); updateCount(); renderText(); pending = null; msg = t('join_done'); render(); bookmark();
}
async function headingKey() {
  if (!plainLine(li)) return;
  if (lineEls[li].classList.contains('intable')) { msg = t('hd_in_table'); render(); return; }
  const m = data.lines[li].match(/^<h([1-6])>/), level = m ? (+m[1] >= 3 ? 0 : +m[1] + 1) : 1;  // H wiederholt: 1 → 2 → 3 → keine
  if (await markup({ kind: 'heading', line: li, level, old: data.lines[li] })) msg = level ? t('hd_set', { n: level }) : t('hd_removed');
  render();
}
// ---- Wörterbuch: welche Rechtschreibung gilt für dieses Buch (buch.json)
let dicsChanged = false;
const dicBoxes = () => [...document.querySelectorAll('#dbody input')];
async function openDics() {
  const st = await (await fetch(BASE + '/api/settings')).json();
  for (const b of dicBoxes()) b.checked = st.dics.includes(b.value);
  $('dyear').textContent = st.year ? t('dic_year', { y: st.year }) : '';
  $('dinfo').textContent = t('dic_total', { n: ov.reduce((a, o) => a + o.n, 0) });
  mode = 'dics'; cf = null; dicsChanged = false; $('dics').classList.add('on'); document.activeElement.blur();
}
async function saveDics() {
  const before = ov.reduce((a, o) => a + o.n, 0);
  let dics = dicBoxes().filter(b => b.checked).map(b => b.value);
  if (!dics.some(d => d != 'vor1901')) { dics.push('1901'); dicBoxes().find(b => b.value == '1901').checked = true; }  // ein Wörterbuch muss gelten
  $('dinfo').textContent = t('dic_wait');
  const r = await (await fetch(BASE + '/api/settings', { method: 'POST', body: JSON.stringify({ dics }) })).json();
  await loadOverview(); dicsChanged = true;
  $('dinfo').textContent = t('dic_changed', { a: before, b: r.total });
}
async function closeDics() {
  $('dics').classList.remove('on'); mode = 'read';
  if (dicsChanged) await loadPage(pg, li); else render();
}
async function dicsKey(e) {
  const k = e.key;
  if (k == 'Escape' || k == 'Enter' || k == 'd' || k == 'D') { e.preventDefault(); await closeDics(); return; }
  const b = dicBoxes()[{ '1': 0, '2': 1, '3': 2 }[k]];
  if (b) { e.preventDefault(); b.checked = !b.checked; await saveDics(); }
}
let wl = null;
async function openWhitelist() {
  const r = await (await fetch(BASE + '/api/whitelist')).json();
  wl = { all: r.words.slice().reverse().map(w => ({ w, gone: false })), sel: 0, changed: false };
  mode = 'wlist'; cf = null; $('wlist').classList.add('on'); $('wfilter').value = ''; document.activeElement.blur(); renderWl();
}
function wlShown() { const q = $('wfilter').value.trim().toLowerCase(); return wl.all.filter(o => !q || o.w.toLowerCase().includes(q)); }
function renderWl() {
  const box = $('wgrid'); box.innerHTML = ''; const items = wlShown(); wl.sel = Math.min(wl.sel, Math.max(0, items.length - 1));
  items.forEach((o, n) => {
    const d = document.createElement('div'); d.className = 'wl' + (n == wl.sel ? ' sel' : '') + (o.gone ? ' gone' : ''); d.textContent = o.w; d.title = o.w;
    d.onclick = async () => { wl.sel = n; await toggleWl(o); };
    box.appendChild(d);
  });
  const g = wl.all.filter(o => o.gone).length;
  $('winfo').textContent = t('wl_count', { n: wl.all.length }) + (g ? t('wl_gone', { g }) : '');
  const el = box.children[wl.sel]; if (el) el.scrollIntoView({ block: 'nearest' });
}
async function toggleWl(o) {
  o.gone = !o.gone; wl.changed = true;
  await fetch(o.gone ? '/api/whitelist_remove' : '/api/whitelist', { method: 'POST', body: JSON.stringify({ word: o.w }) });
  renderWl();
}
async function closeWl() {
  const ch = wl.changed; $('wlist').classList.remove('on'); wl = null; mode = 'read'; document.activeElement.blur();
  if (ch) { await loadOverview(); await loadPage(pg, li); } else render();
}
async function wlKey(e) {
  const k = e.key, inp = e.target.tagName == 'INPUT';
  if (k == 'Escape') { e.preventDefault(); await closeWl(); return; }
  if (inp) { if (k == 'Enter' || k == 'Tab' || k == 'ArrowDown') { e.preventDefault(); e.target.blur(); } return; }
  const items = wlShown(), cols = Math.max(1, Math.floor(($('wgrid').clientWidth - 28 + 8) / 238));
  if (k == 'ArrowRight') wl.sel++; else if (k == 'ArrowLeft') wl.sel--;
  else if (k == 'ArrowDown') wl.sel += cols; else if (k == 'ArrowUp') wl.sel -= cols;
  else if (k == 'Delete' || k == ' ') { e.preventDefault(); if (items[wl.sel]) await toggleWl(items[wl.sel]); return; }
  else if (k == 'Tab') { e.preventDefault(); $('wfilter').focus(); $('wfilter').select(); return; }
  else return;
  e.preventDefault(); wl.sel = Math.max(0, Math.min(items.length - 1, wl.sel)); renderWl();
}
function startSeries() {
  if (pending) return openSeries(pending.old, pending.new);
  if (mode == 'fix' && cf) { li = cf.line; return openSeries(cf.word.replace('¬', ''), ''); }
  return openSeries('', '');
}
async function whitelistRead() {
  // Lesemodus: erstes rotes Wort der Lesezeile bestätigen (nochmal F8 = nächstes)
  // von links nach rechts; ohne rotes Wort in der Lesezeile: das nächste weiter unten auf der Seite, diese Zeile wird Lesezeile
  const f = data.flags.find(x => isJoin(x) && x.line + 1 == li) || data.flags.find(x => x.line == li) || data.flags.find(x => x.line > li);
  if (!f) { msg = t('no_red'); render(); return; }
  if (f.line > li) { li = f.line; bookmark(); }
  const w = f.word.replace('¬', '');
  await fetch(BASE + '/api/whitelist', { method: 'POST', body: JSON.stringify({ word: w }) });
  data = await (await fetch(BASE + '/api/page/' + pg)).json(); updateCount();
  pending = null; msg = t('remembered', { w }); render();
  loadOverview();
}
async function footnoteSep() {
  // F: Fußnoten beginnen mit der Lesezeile (Trenner --- davor setzen/verschieben; steht er schon dort: entfernen)
  if (skippable(li) || (li == 0 && data.lines[0].startsWith('#'))) return;
  const r = await fetch(BASE + '/api/fnsep/' + pg, { method: 'POST', body: JSON.stringify({ line: li, old: data.lines[li] }) });
  if (r.status == 409) { await loadPage(pg, li); msg = t('changed_outside'); render(); return; }
  const x = await r.json(); data = x.data; li = x.line; pending = null;
  msg = t(x.action == 'gesetzt' ? 'fn_set' : 'fn_removed');
  updateCount(); renderText(); render(); bookmark();
}
function setZoom(z) { zoom = Math.min(4, Math.max(0.4, z)); try { localStorage.setItem('zoom', zoom); } catch (e) {} layoutImage(); }

async function onKey(e) {
  if (e.key == 'F1') { e.preventDefault(); window.open($('helplink').href, '_blank'); return; }
  // Strg+F (Mac: Cmd+F) ist die gewohnte Suche – beim Lesen unsere statt der des Browsers
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key == 'f' || e.key == 'F') && data && mode == 'read') { e.preventDefault(); askOpen('find'); return; }
  if (e.ctrlKey || e.altKey || e.metaKey || !data) return;
  if (mode == 'ask') return askKey(e);
  if (mode == 'serie') return serieKey(e);
  if (mode == 'table') return tbKey(e);
  if (mode == 'wlist') return wlKey(e);
  if (mode == 'dics') return dicsKey(e);
  if (e.key == 'F9') { e.preventDefault(); await startSeries(); return; }
  if (mode == 'read') {
    if (e.target.tagName == 'SELECT') return;
    const k = e.key;
    if (k == 'ArrowDown' || k == 'j') await move(1);
    else if (k == 'ArrowUp' || k == 'k') await move(-1);
    else if (k == ' ') await toFlag();
    else if (k == 'Enter') {  // rotes Wort in der Lesezeile: direkt dorthin; sonst Zeile frei bearbeiten
      const f = data.flags.find(x => x.line == li && !(passed && passed.line == li && x.start <= passed.start)) || data.flags.find(x => x.line == li);
      if (f) enterFix(f); else enterFree();
    }
    else if (k == 'F2') enterFree();
    else if (k == 'PageDown') await gotoPage(1);
    else if (k == 'PageUp') await gotoPage(-1);
    else if (k == 'Home') { li = 0; while (li < data.lines.length - 1 && skippable(li)) li++; render(); bookmark(); }
    else if (k == 'End') { li = data.lines.length - 1; while (li > 0 && skippable(li)) li--; render(); bookmark(); }
    else if (k == '+') setZoom(zoom * 1.15);
    else if (k == '-') setZoom(zoom / 1.15);
    else if (k == '0') setZoom(1);
    else if (k == 'F8') await whitelistRead();
    else if (k == 'u' || k == 'U') await undoSeries();
    else if (k == 'w' || k == 'W') await openWhitelist();
    else if (k == 'd' || k == 'D') await openDics();
    else if (k == 'f' || k == 'F') await footnoteSep();
    else if (k == 't' || k == 'T') await tableKey();
    else if (k == 'h' || k == 'H') await headingKey();
    else if (k == 'v' || k == 'V') await joinLine();
    else if (k == 'r' || k == 'R') { await loadOverview(); await loadPage(pg, li); }
    else if (k == 'g' || k == 'G') askOpen('goto');
    else if (k == 's' || k == 'S' || k == '/') askOpen('find');
    else if (k == 'n' || k == 'N' || k == 'F3') await nextHit(e.shiftKey ? -1 : 1);
    else return;
    e.preventDefault();
  } else {
    if (e.key == 'Enter' && e.shiftKey) { e.preventDefault(); await splitLine(); }
    else if (e.key == 'Enter') { e.preventDefault(); await commit(); }
    else if (e.key == 'Escape') { e.preventDefault(); if (mode == 'fix') passed = { line: cf.line, start: cf.start }; toRead(mode == 'fix' ? cf.line : li); }
    else if (e.key == 'F8' && mode == 'fix') { e.preventDefault(); await whitelist(); }
    else if (e.key == 'Tab' && mode == 'fix') { e.preventDefault(); await toFlag({ line: cf.line, start: cf.start }); }
  }
}
// F7: Trennzeichen ¬ an der Schreibmarke einfügen (in jedem Eingabefeld)
document.addEventListener('keydown', e => {
  if (e.key != 'F7' || e.target.tagName != 'INPUT') return;
  e.preventDefault(); const el = e.target; el.setRangeText('¬', el.selectionStart, el.selectionEnd, 'end'); el.dispatchEvent(new Event('input'));
}, true);
document.addEventListener('keydown', async e => { if (busy) { e.preventDefault(); return; } busy = true; try { await onKey(e); } finally { busy = false; } });
for (const b of dicBoxes()) b.onchange = async () => { if (!busy) { busy = true; try { await saveDics(); } finally { busy = false; } } };
$('diclink').onclick = async e => { e.preventDefault(); if (mode == 'read' && !busy) { busy = true; try { await openDics(); } finally { busy = false; } } };
$('pagesel').onchange = async e => { await loadPage(e.target.value, 0); e.target.blur(); bookmark(); };
$('wfilter').addEventListener('input', () => { if (wl) { wl.sel = 0; renderWl(); } });
window.addEventListener('resize', () => { layoutText(); layoutImage(); });
let lastClick = null;
function charOffset(d, x, y) {
  // Zeichenposition in der Zeile unter dem Mauszeiger
  const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
  if (!r || !d.contains(r.startContainer)) return null;
  const r2 = document.createRange(); r2.selectNodeContents(d); r2.setEnd(r.startContainer, r.startOffset);
  return r2.toString().length;
}
$('lines').addEventListener('dblclick', async e => {
  // Doppelklick auf ein Wort: Korrekturmodus mit diesem Wort markiert (Position stammt vom ersten Klick, weil der Text danach rollt)
  const c = lastClick; if (!c || c.off == null) return;
  try { getSelection().removeAllRanges(); } catch (x) {}
  for (let n = 0; n < 80 && busy; n++) await new Promise(r => setTimeout(r, 25));
  if (mode != 'read' || busy || pg != c.p || c.i >= data.lines.length) return;
  li = c.i; const l = data.lines[li]; c.off = rawPos(l, c.off);
  const f = data.flags.find(x => x.line == li && c.off >= x.start && c.off <= x.start + x.len) || data.flags.find(x => isJoin(x) && x.line + 1 == li && c.off >= (x.start2 || 0) && c.off <= (x.start2 || 0) + part2len(x));
  if (f) { enterFix(f); return; }
  let a = c.off, b = c.off; const W = /[A-Za-zÄÖÜäöüß]/;
  if (a > 0 && !W.test(l[a] || '') && W.test(l[a - 1])) { a--; b--; }
  while (a > 0 && W.test(l[a - 1])) a--; while (b < l.length && W.test(l[b])) b++;
  enterFree([a, b]);
});
$('lines').addEventListener('click', async e => {
  if (mode != 'read' || busy) return; const d = e.target.closest('#lines div[data-i]'); if (!d) return;
  if (e.detail <= 1) lastClick = { p: d.dataset.p, i: +d.dataset.i, off: charOffset(d, e.clientX, e.clientY) };
  else return;  // zweiter Klick eines Doppelklicks: der Text ist schon gerollt, nicht nochmal springen
  const i = +d.dataset.i;
  if (d.dataset.p == pg) { if (!skippable(i)) { li = i; msg = ''; render(); bookmark(); } }
  else { busy = true; try { await loadPage(d.dataset.p, i, true); bookmark(); } finally { busy = false; } }
});
function onWheel(e) {
  // Mausrad: eine Raste = eine Zeile, läuft fließend über Seitengrenzen
  if (mode != 'read') return; e.preventDefault();
  wheelAcc += e.deltaMode == 1 ? e.deltaY * 33 : e.deltaY;
  if (busy) return;
  const n = Math.trunc(wheelAcc / 100); if (!n) return; wheelAcc -= n * 100;
  busy = true; (async () => { try { for (let k = 0; k < Math.min(Math.abs(n), 6); k++) await move(Math.sign(n)); } finally { busy = false; } })();
}
$('text').addEventListener('wheel', onWheel, { passive: false }); $('imgpane').addEventListener('wheel', onWheel, { passive: false });

(async () => {
  await loadOverview();
  let bm = {}; try { bm = await (await fetch(BASE + '/api/bookmark')).json(); } catch (e) {}
  if (!(bm.page && await loadPage(bm.page, bm.line))) { const first = ov.find(o => o.n > 0) || ov[0]; await loadPage(first.page, 0); }
  // Selbsttest: ?keys=Space,Tab,Escape,ArrowDown spielt Tasten ab; "=text" setzt das Eingabefeld
  const ks = new URLSearchParams(location.search).get('keys');
  for (const k of ks ? ks.split(',') : []) {
    if (k.startsWith('=')) $('edit').value = k.slice(1);
    else if (k.startsWith('caret=')) $('edit').setSelectionRange(+k.slice(6), +k.slice(6));
    else if (k == 'Shift+Enter' || k == 'Shift Enter') (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true }));
    else if (k.startsWith('Ctrl+') || k.startsWith('Ctrl ')) (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k.slice(5), ctrlKey: true, bubbles: true }));  // »+« wird in der Adresse zum Leerzeichen
    else if (k.includes('=')) $(k.split('=')[0]).value = k.split('=')[1];
    else (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k == 'Space' ? ' ' : k, bubbles: true }));
    await new Promise(r => setTimeout(r, 400));
  }
})();
</script>
