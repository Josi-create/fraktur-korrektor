<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fraktur-Korrektor</title>
<style>
html,body{height:100%}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#e9e6df;color:#222;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;gap:14px;align-items:center;padding:6px 12px;background:#2b2b2b;color:#eee;font-size:14px;flex:none}
#top select{font-size:14px}
#mode{padding:2px 10px;border-radius:10px;font-weight:bold;background:#3a6;color:#fff}
#mode.fix{background:#c33}
#mode.free{background:#c80}
#mode.konf{background:#e08a00}
#lines div.konf{outline:2px solid #e08a00;outline-offset:-2px;background:#fff1dc}  /* Zeile aus dem Zusammenführen, noch anzusehen (#66) */
#konflink{color:#b35c00;font-weight:bold}
#word .kbox{font-size:15px;line-height:1.5}
#word .kbox b{color:#000;background:#fff1dc;padding:0 4px;border-radius:3px}
#word .kbox b.dort{background:#dff3e0}
#word .kbox button{margin:4px 6px 0 0;font-size:14px}
#pos{color:#ccc;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title{max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top>*{flex-shrink:0} #top>#pos,#top>#title{flex-shrink:1}
#top a{color:#ddd}
#top .langsw b{color:#fff}
/* Suchen und Gehe-zu: Eingabezeile und Fundstellen-Widget in der Kopfleiste */
#qbar{display:none;gap:6px;align-items:center} #qbar.on{display:flex}
#qbar input{font-size:14px;padding:2px 6px;width:210px;border-radius:3px;border:1px solid #888}
#find{display:none;gap:8px;align-items:center;background:#454545;border-radius:12px;padding:2px 6px 2px 10px} #find.on{display:flex}
#find button,#pnav button{font:13px Segoe UI,Arial,sans-serif;padding:1px 9px;border:1px solid #888;border-radius:9px;background:#333;color:#eee;cursor:pointer}
#find button:hover,#pnav button:hover{background:#5a5a5a} #find b,#pnav b{color:#fff;min-width:44px;text-align:center}
/* Blättern wie bei der Suche: ← Seite [Auswahl] 4 / 30 → */
#pnav{display:flex;gap:8px;align-items:center} #pnav button:disabled{opacity:.4;cursor:default;background:#333}
.found{background:#9fdcff;border-radius:2px;outline:2px solid #1780c0}
#loading{position:absolute;inset:0;z-index:9;background:#e9e6df;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:0 15%;text-align:center;font-size:18px;line-height:1.6;color:#555}
#lprog{width:min(520px,90%);height:16px} #lpage{font-size:15px;color:#777}
#main{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:10px;padding:10px;min-height:0}
.pane{background:#fff;border:1px solid #bbb;border-radius:4px;position:relative;overflow:hidden;min-height:0}
#noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:#666}
#noimg p{max-width:360px;line-height:1.6;margin:0}
#noimg button{font:15px Segoe UI,Arial,sans-serif;padding:10px 20px;border:1px solid #285;border-radius:4px;background:#3a6;color:#fff;cursor:pointer}
#noimg button:hover{background:#395}
#imgwrap{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .18s ease-out}
#imgwrap img{display:block;position:absolute}
.hl{position:absolute;pointer-events:none;box-sizing:border-box}
#hlLine{background:rgba(255,220,60,.28)}
#hlWord,#hlWord2{border:solid red}
#right{display:flex;flex-direction:column;gap:10px;min-height:0}
/* Wort und Tastaturhilfe über beide Spalten: nimmt links dem Bild etwas Höhe, gibt sie rechts dem Text (#55) */
/* Kürzel unten ohne Rahmen; Mindesthöhe = Lesemodus-Kürzel, damit Bild und Text beim Moduswechsel nicht springen */
#korr{grid-column:1 / -1;grid-row:2;padding:0;border:0;background:none;overflow:visible;min-height:72px}
#word{font-size:17px;margin-bottom:2px}
#word b{color:#c00}
/* Eingabefelder liegen im Textfenster genau über der Lesezeile (und der Folgezeile bei getrennten Wörtern) */
#edit,#edit2{position:absolute;left:21px;right:21px;z-index:3;margin:0;padding:0 5px;box-sizing:border-box;border:2px solid #c33;border-radius:3px;background:#fffbe6;color:#000;font-family:Georgia,'Times New Roman',serif;font-size:calc(19px * var(--tz, 1));outline:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#edit2{border-color:#c60}
#help{color:#666;font-size:13px;line-height:1.5}
kbd{background:#eee;border:1px solid #bbb;border-bottom-width:2px;border-radius:3px;padding:0 4px;font-family:Consolas,monospace;font-size:12px;color:#222}
#text{flex:1}
/* --tz: Textzoom (Strg + / − / 0), alle Schriftgrade im Textfenster skalieren mit */
#lines{position:absolute;left:0;right:0;top:0;padding:0 22px;transition:transform .18s ease-out;font-family:Georgia,'Times New Roman',serif;font-size:calc(19px * var(--tz, 1));line-height:1.65}
#lines div{white-space:pre-wrap;border-radius:3px;padding:0 6px;color:#555}
#lines div.cur{background:#fff3b8;color:#000}
#lines div.head{color:#aaa;font-size:calc(14px * var(--tz, 1));font-family:Segoe UI,Arial,sans-serif}
#lines div.sep{border-top:1px solid #999;height:0;margin:10px 0;padding:0}
#lines div.fn{font-size:calc(16px * var(--tz, 1))}
#lines div.pgsep{text-align:center;color:#999;font:13px Segoe UI,Arial,sans-serif;letter-spacing:1px;margin:18px 0 10px 0;white-space:nowrap;overflow:hidden}
.flag{background:#f99;border-radius:2px}
.auto{background:#fc8;border-radius:2px}
.fnref{background:#c9dcff;border-radius:2px}  /* Fußnotenzeichen, das hochzustellen wäre */
.curflag{outline:2px solid #c00}
/* Auszeichnung im Text (XHTML wie im EPUB) wird nicht gezeigt, sondern dargestellt: Tabellen als Gitter – jede Zelle ist
   weiterhin eine Zeile (Lesecursor, Klick, Eingabefeld) –, Überschriften groß, <em>/<sup> … als Schrift */
#lines .tblgrid{display:grid;width:max-content;max-width:100%;overflow-x:auto;margin:8px 0 8px 6px;padding:0;border-radius:0;border-top:1px solid #8ab;border-left:1px solid #8ab;white-space:normal}
#lines .tblgrid > div{border-right:1px solid #8ab;border-bottom:1px solid #8ab;border-radius:0;padding:1px 12px;color:#333;white-space:pre-wrap}
#lines .tblgrid > div.thcell{font-weight:bold;background:#eaf2fb}
#lines .tblgrid > div.cur{background:#fff3b8;color:#000}
#lines .tblgrid > div.blank{display:none}
#lines div.tsel{background:#d6eaff !important;color:#000}
#lines div.para{text-indent:1.5em}
#lines div.hd1{font-size:calc(27px * var(--tz, 1));font-weight:bold;color:#222} #lines div.hd2{font-size:calc(23px * var(--tz, 1));font-weight:bold;color:#222} #lines div.hd3{font-size:calc(20px * var(--tz, 1));font-weight:bold;color:#222}
#tprev{border-collapse:collapse;font:14px Georgia,serif;margin-top:6px;color:#222} #tprev td,#tprev th{border:1px solid #9bc;padding:1px 9px} #tprev th{background:#e3eefa}
#centerline{position:absolute;left:0;width:5px;top:25%;height:30px;margin-top:-15px;background:#c90;border-radius:0 3px 3px 0}
#shint{margin-top:2px;font-size:14px;color:#a40} #shint:empty{display:none}
/* Korrekturvorschläge: kleines Aufklappmenü unter dem roten Wort; ↓ ↑ wählt, Klick übernimmt */
#sugbox{position:absolute;z-index:4;display:none;background:#fff;border:1px solid #c90;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.25);font-family:Georgia,'Times New Roman',serif;font-size:calc(17px * var(--tz, 1));min-width:110px;max-width:60%;overflow:hidden}
#sugbox div{padding:2px 12px;cursor:pointer;white-space:nowrap;color:#000} #sugbox div:hover{background:#fff3b8} #sugbox div.on{background:#c90;color:#fff}
#sugbox small{display:block;padding:3px 12px;color:#888;font:12px Segoe UI,Arial,sans-serif;border-top:1px solid #eee;white-space:nowrap}
#serie{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#serie.on{display:flex}
#shead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
#shead input{font-family:Consolas,monospace;font-size:18px;padding:4px 6px;width:220px}
#sinfo{margin-left:14px;color:#a40}
#slist{flex:1;overflow:auto}
.srow{display:flex;align-items:center;gap:14px;padding:3px 10px;border-bottom:1px solid #eee;border-left:6px solid transparent}
.srow.sel{background:#fff3b8;border-left-color:#c90}
.srow.off{opacity:.35}
.srow .chk{font-size:20px;width:22px;flex:none}
.srow .pgno{color:#888;font-size:13px;width:70px;flex:none}
.crop{flex:none;position:relative;overflow:hidden;background-repeat:no-repeat;border:1px solid #ddd;background-color:#f4f4f4}
.crop i{position:absolute;border:2px solid red;box-sizing:border-box}
.stext{font-family:Georgia,serif;font-size:16px;white-space:pre-wrap}
#wlist{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#wlist.on{display:flex}
#dics,#notes,#repl,#toc{position:absolute;inset:0;background:#fff;z-index:5;display:none;flex-direction:column;border:1px solid #bbb}
#dics.on,#notes.on,#repl.on,#toc.on{display:flex}
#dhead,#nhead,#rhead,#ihead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
/* Inhalt (I): die Überschriften des Buchs, eingerückt nach Ebene, rechts die gedruckte Seitenzahl */
#ilist{flex:1;overflow:auto;padding:8px 0}
.irow{display:flex;gap:16px;padding:3px 14px;border-left:6px solid transparent;cursor:pointer;font-family:Georgia,serif;font-size:17px}
.irow:hover{background:#faf8f2} .irow.sel{background:#fff3b8;border-left-color:#c90}
.irow .itxt{flex:1} .irow .ipg{color:#888;font:14px Segoe UI,Arial,sans-serif;white-space:nowrap;padding-top:3px}
.irow.l1{font-weight:bold} .irow.l2 .itxt{padding-left:26px} .irow.l3 .itxt{padding-left:52px}
#iempty{padding:18px 22px;max-width:760px;font-size:16px;line-height:1.5;color:#555}
#dbody,#nbody,#rbody{padding:18px 22px;max-width:760px;font-size:16px;line-height:1.5}
#nbody input,#rbody #rsrc{flex:1;font-size:16px;padding:4px 6px} #nbody button,#rbody button{font-size:15px} #ninfo,#rinfo{margin-top:14px;color:#a40;min-height:24px}
#rgo{padding:8px 18px;border:1px solid #285;border-radius:4px;background:#3a6;color:#fff;cursor:pointer} #rgo:disabled{opacity:.5}
#rbody label{cursor:pointer} #rn{width:70px;font-size:16px;padding:3px}
#dbody label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid #ccc;border-radius:5px;margin-bottom:8px;cursor:pointer}
#dbody label:hover{background:#faf8f2} #dbody input{margin-top:6px;transform:scale(1.3)} #dbody small{display:block;color:#666;font-size:14px}
#dyear{color:#555;margin-bottom:12px} #dinfo{margin-top:14px;color:#a40;min-height:24px}
#whead{padding:10px 14px;border-bottom:1px solid #ccc;font-size:16px;background:#f6f3ea}
#whead input{font-family:Consolas,monospace;font-size:17px;padding:4px 6px;width:220px}
#wgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,230px);grid-auto-rows:30px;gap:2px 8px;padding:10px 14px;align-content:start}
.wl{font-family:Georgia,serif;font-size:16px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.wl:hover{background:#f3f3f3}
.wl.sel{background:#fff3b8;border-color:#c90}
.wl.gone{text-decoration:line-through;color:#c33;background:#fdeaea}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div id="top">
 <a href="/bibliothek" data-t="library"></a>
 <b id="title">Fraktur-Korrektor</b>

 <span id="find"><span id="findq"></span><button type="button" id="fprev"></button><b id="findn"></b><button type="button" id="fnext"></button><button type="button" id="fclose" data-t-title="find_close">×</button></span>
 <a href="#" id="toclink" data-t="toc_link"></a>

 <a data-help="faq" target="_blank" data-t="faq_link"></a>
 <span class="langsw"></span>
</div>
<div id="main">
 <div id="loading"><div data-t="loading"></div><progress id="lprog" max="1" value="0" style="display:none"></progress><div id="lpage"></div></div>
 <div class="pane" id="korr">
  <div id="word"></div>
  <div id="help"></div>
  <div id="shint"></div>
 </div>
 <div class="pane" id="imgpane">
  <div id="imgwrap"><div class="hl" id="hlLine"></div><div class="hl" id="hlWord"></div><div class="hl" id="hlWord2"></div></div>
  <div id="noimg" style="display:none"><p data-t="noimg_text"></p><button type="button" id="noimgBtn" data-t="noimg_btn"></button></div>
 </div>
 <div id="right">
  <div class="pane" id="text"><div id="centerline"></div><div id="lines"></div>
   <input id="edit" type="text" spellcheck="false" style="display:none">
   <input id="edit2" type="text" spellcheck="false" style="display:none" data-t-title="edit2_title">

  </div>
 </div>
 <div id="dics">
  <div id="dhead"><span data-t="dic_head"></span>
   <div style="color:#666;font-size:13.5px;margin-top:6px" data-t="dic_help"></div></div>
  <div id="dbody">
   <div id="dyear"></div>
   <label><input type="checkbox" value="vor1901"><span><b data-t="dic_vor1901"></b><small data-t="dic_vor1901_ex"></small></span></label>
   <label><input type="checkbox" value="1901"><span><b data-t="dic_1901"></b><small data-t="dic_1901_ex"></small></span></label>
   <label><input type="checkbox" value="neu"><span><b data-t="dic_neu"></b><small data-t="dic_neu_ex"></small></span></label>

  </div>
 </div>
 <div id="notes">
  <div id="nhead"><span data-t="note_head"></span>
   <div style="color:#666;font-size:13.5px;margin-top:6px" data-t="note_help"></div></div>
  <div id="nbody">
   <p data-t="note_intro"></p>
   <p data-t="note_folder"></p>
   <div style="display:flex;gap:8px"><input id="nfolder" spellcheck="false" data-t-ph="note_folder_ph"><button id="nchoose" data-t="choose_folder"></button></div>
   <div id="ninfo"></div>
  </div>
 </div>
 <div id="repl">
  <div id="rhead"><span id="rtitle"></span>

   <div id="rpdf" style="display:none;margin-top:10px"><label><span data-t="repl_pdfpage"></span> <input id="rn" type="number" min="1"></label> <span id="rpages" style="color:#666"></span></div>
   <div style="margin-top:10px"><span data-t="ocr_script"></span>: <label><input type="radio" name="rscript" value="fraktur" checked> <span data-t="script_fraktur"></span></label> &nbsp; <label><input type="radio" name="rscript" value="antiqua"> <span data-t="script_antiqua"></span></label></div>

 </div>

 </div>
 <div id="wlist">
  <div id="whead"><span data-t="wl_head"></span> <input id="wfilter" spellcheck="false" data-t-ph="filter"><span id="winfo" style="margin-left:14px;color:#a40"></span>
   <div style="color:#666;font-size:13.5px;margin-top:6px" data-t="wl_help"></div>
  </div>
  <div id="wgrid"></div>
 </div>
 <div id="serie">
  <div id="shead"><span data-t="ser_head"></span> <input id="sOld" spellcheck="false" data-t-ph="ser_word"> → <input id="sNew" spellcheck="false" data-t-ph="ser_new"><span id="sinfo"></span>
   <div id="shelp" style="color:#666;font-size:13.5px;margin-top:6px" data-t="ser_help"></div>

 </div>

<script>
const $ = id => document.getElementById(id);
const BASE = (location.pathname.match(/^\/buch\/[0-9a-f]+/) || [''])[0];  // jedes Buch hat seine eigene Adresse
applyI18n();
let ov = [], pg = null, data = null, li = 0, mode = 'read', cf = null, passed = null, busy = false, lastCy = null, nsel = null;
let konf = [];  // Zeilen aus dem Zusammenführen zweier Arbeitsstände (#66), die der Nutzer noch ansehen muss: [{page, line, …}]
let zoom = 1; try { zoom = parseFloat(localStorage.getItem('zoom')) || 1; } catch (e) {}
// Schriftgröße des Textes (--tz), unabhängig vom Bild: je Buch so, dass eine volle gedruckte Zeile auch rechts in eine
// Zeile passt (zeichen: Länge einer vollen Zeile, vom Server). Strg + / − stellen sie für dieses Buch fest ein, Strg+0
// wieder auf passend; eine frühere Einstellung für alle Bücher (tzoom) bleibt die Obergrenze.
let tzoom = 1, tzFixed = null, tzAll = 1, zeichen = 0, charW = 0;
try { tzAll = parseFloat(localStorage.getItem('tzoom')) || 1; tzFixed = parseFloat(localStorage.getItem('tzoom' + BASE)) || null; } catch (e) {}
function fitText() {
  let z = tzFixed || tzAll;
  if (!tzFixed && zeichen) {
    if (!charW) {  // mittlere Zeichenbreite der Textschrift bei 19px, an gewöhnlichem deutschem Text gemessen
      const c = document.createElement('canvas').getContext('2d'), s = 'Die vorliegende Studie erzählt von den deutschen Kolonien am Nordrand des Schwarzen Meeres. Sie berichtet, wie die Revolution über diese Region hereinbrach;';
      c.font = "19px Georgia, 'Times New Roman', serif"; charW = c.measureText(s).width / s.length;
    }
    const avail = $('lines').clientWidth - 44 - 12 - 8;  // ohne den Innenabstand des Textfensters und der Zeile
    if (avail > 100) z = Math.min(z, Math.max(0.6, avail / (zeichen * charW)));
  }
  tzoom = z; document.documentElement.style.setProperty('--tz', tzoom);
}
fitText();
let prevD = null, nextD = null, nbEls = {}, wheelAcc = 0;
let imgEls = {}, imgState = null, imgKeep = null;  // Seitenbilder im Stapel, letzte Lage des Stapels, beim Seitenwechsel: das bisherige Bild festhalten
const IMG_GAP = 60;  // Abstand zwischen den Seitenbildern, in Bildpixeln
const NOTRANS = location.search.includes('notrans');
let lineEls = [], bmTimer = null, pending = null, msg = '', ser = null;
let hits = null, hi = -1, ask = null;  // Suche: Fundstellen im ganzen Buch, die aktuelle, offene Eingabezeile (find | goto)
const WRE = /^[A-Za-zÄÖÜäöüß]+/;
const READ_POS = 0.25;  // Lesezeile bei 1/4 der Fensterhöhe (Text und Bild)
if (NOTRANS) { $('imgwrap').style.transition = 'none'; $('lines').style.transition = 'none'; }  // für Screenshots/Tests

// Am Mac heißt die Taste zu Strg+F, Strg+⌫ usw. ⌘ (onKey nimmt metaKey wie ctrlKey)
const MAC = /Mac/i.test(navigator.platform), macKeys = s => MAC ? s.replace(/<kbd>(Strg|Ctrl)<\/kbd>/g, '<kbd>⌘</kbd>') : s;
const HELP = { read: macKeys(t('help_read')), fix: macKeys(t('help_fix')), free: macKeys(t('help_free')), table: t('help_table'), konf: t('help_konf') };

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
// Auszeichnung: dieselben Elemente wie der Server (korrlib.MARKUP)
const TAGS = 'table|tr|td|th|h[1-6]|em|strong|i|b|sup|sub|p|blockquote|br';
const TAGRE = new RegExp('</?(?:' + TAGS + ')\\s*/?>', 'g'), TAGESC = new RegExp('&lt;(/?(?:' + TAGS + ')\\s*/?)>', 'g');

async function resolveConflict(action) {

  data = await r.json(); updateCount(); mode = 'read'; msg = t(action == 'take' ? 'konf_taken' : 'konf_kept');
  konf = konf.filter(x => !(x.page == pg && x.dort == k.dort && x.alt == k.alt));
  $('konflink').style.display = konf.length ? '' : 'none'; $('konflink').textContent = t(konf.length == 1 ? 'konf_link_1' : 'konf_link_n', { n: konf.length });

}
async function konfKey(e) {

$('konflink').onclick = e => { e.preventDefault(); if (mode == 'read') guarded(openConflict)(); };

async function onKey(e) {
  if (e.key == 'F1') { e.preventDefault(); window.open($('helplink').href, '_blank'); return; }
  // Strg+F (Mac: Cmd+F) ist die gewohnte Suche – beim Lesen unsere statt der des Browsers
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key == 'f' || e.key == 'F') && data && mode == 'read') { e.preventDefault(); askOpen('find'); return; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey && (e.key == '+' || e.key == '*' || e.code == 'NumpadAdd') && e.target.tagName == 'INPUT'
      && (mode == 'fix' || mode == 'free')) { e.preventDefault(); supToggle(e.target); return; }  // DE-Tastatur: Umschalt++ ist »*«
  // Strg + / − / 0: Schriftgröße des Textes (statt des Browser-Zooms, der auch Leisten und Bild vergrößert)
  if ((e.ctrlKey || e.metaKey) && !e.altKey && data && ['+', '-', '0', '='].includes(e.key)) { e.preventDefault(); setTextZoom(e.key == '0' ? null : e.key == '-' ? tzoom / 1.15 : tzoom * 1.15); return; }
  // Strg/⌘+⌫ löscht Rauschzeilen, Strg/⌘+Z holt sie zurück – nur beim Lesen; im Eingabefeld gelten sie wie gewohnt.
  // Bewusst nicht Entf allein: Darauf gerät man beim Lesen leicht, und die Zeile wäre weg.
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && data && mode == 'read' && e.target.tagName != 'INPUT') {
    if (e.key == 'Backspace') { e.preventDefault(); await deleteLines(); return; }
    if (e.key == 'z' || e.key == 'Z') { e.preventDefault(); await undeleteLines(); return; }
  }
  if (e.ctrlKey || e.altKey || e.metaKey || !data) return;
  if (mode == 'ask') return askKey(e);
  if (mode == 'serie') return serieKey(e);
  if (mode == 'table') return tbKey(e);
  if (mode == 'wlist') return wlKey(e);
  if (mode == 'toc') return tocKey(e);
  if (mode == 'dics') return dicsKey(e);
  if (mode == 'notes') return notesKey(e);
  if (mode == 'repl') return replKey(e);
  if (mode == 'konf') return konfKey(e);
  if (e.key == 'F9') { e.preventDefault(); await startSeries(); return; }
  if (e.key == 'F4') { e.preventDefault(); await makeNote(); return; }
  if (mode == 'read') {
    if (e.target.tagName == 'SELECT') return;
    const k = e.key;
    if (e.shiftKey && (k == 'ArrowDown' || k == 'ArrowUp')) { e.preventDefault(); selMove(k == 'ArrowDown' ? 1 : -1); return; }
    if (nsel != null && k != 'Shift') { nsel = null; render(); if (k == 'Escape') { e.preventDefault(); return; } }
    if (k == 'ArrowDown' || k == 'j') await move(1);
    else if (k == 'ArrowUp' || k == 'k') await move(-1);
    else if (k == ' ') await toFlag();
    else if (k == 'Enter') {  // rotes Wort in der Lesezeile: direkt dorthin; sonst Zeile frei bearbeiten
      const f = data.flags.find(x => x.line == li && !(passed && passed.line == li && x.start <= passed.start)) || data.flags.find(x => x.line == li);
      if (f) enterFix(f); else enterFree();
    }
    else if (k == 'F2') enterFree();
    else if (k == 'PageDown') await gotoPage(1);
    else if (k == 'PageUp') await gotoPage(-1);
    else if (k == 'Home') { li = 0; while (li < data.lines.length - 1 && skippable(li)) li++; render(); bookmark(); }
    else if (k == 'End') { li = data.lines.length - 1; while (li > 0 && skippable(li)) li--; render(); bookmark(); }
    else if (k == '+') setZoom(zoom * 1.15);
    else if (k == '-') setZoom(zoom / 1.15);
    else if (k == '0') setZoom(1);
    else if (k == 'F8' || k == '#') await whitelistRead();  // # liegt am Mac neben Enter, F8 nur mit fn
    else if (k == 'u' || k == 'U') await undoSeries();
    else if (k == 'w' || k == 'W') await openWhitelist();
    else if (k == 'd' || k == 'D') await openDics();
    else if (k == 'o' || k == 'O') await openNotes();
    else if (k == 'f' || k == 'F') await footnoteSep();
    else if (k == 't' || k == 'T') await tableKey();
    else if (k == 'h' || k == 'H') await headingKey();
    else if (k == 'a' || k == 'A') await paraKey();
    else if (k == 'i' || k == 'I') await openToc();
    else if ((k == 'v' || k == 'V') && e.shiftKey) await unjoinLine();
    else if (k == 'v' || k == 'V') await joinLine();
    else if (k == 'z' || k == 'Z') await openConflict();  // K geht wie ↑ eine Zeile hoch (j/k)
    else if (k == 'r' || k == 'R') { await loadOverview(); await loadPage(pg, li); }
    else if (k == 'g' || k == 'G') askOpen('goto');
    else if (k == 's' || k == 'S' || k == '/') askOpen('find');
    else if (k == 'n' || k == 'N' || k == 'F3') await nextHit(e.shiftKey ? -1 : 1);
    else return;
    e.preventDefault();
  } else {
    if (mode == 'fix' && cf && cf.kind == 'fnref' && e.target.id == 'edit') {  // Fußnotenzeichen: Nummer einstellen oder tippen
      if (e.key == 'ArrowUp' || e.key == 'ArrowDown') { e.preventDefault(); fnrefStep(e.key == 'ArrowUp' ? 1 : -1); return; }
      if (/^\d$/.test(e.key) && fnrefDigit(e.target, e.key)) { e.preventDefault(); return; }
    }
    // ↓ ↑ gehen durch die Vorschläge (bei getrenntem Wort führen Tab und → weiter in die zweite Hälfte)
    if (mode == 'fix' && sug && sug.items.length && (e.key == 'ArrowDown' || e.key == 'ArrowUp')) { e.preventDefault(); applySug(sug.i + (e.key == 'ArrowDown' ? 1 : -1)); return; }
    if (hopJoin(e)) return;
    if (e.key == 'Enter' && e.shiftKey) { e.preventDefault(); await splitLine(); }
    else if (e.key == 'Enter') { e.preventDefault(); await commit(); }
    else if (e.key == 'Escape') { e.preventDefault(); if (mode == 'fix') passed = { line: cf.line, start: cf.start }; toRead(mode == 'fix' ? cf.line : li); }
    else if ((e.key == 'F8' || e.key == '#') && mode == 'fix') { e.preventDefault(); await whitelist(); }
    else if (e.key == 'Tab' && mode == 'fix') { e.preventDefault(); await toFlag({ line: cf.line, start: cf.start }); }
  }
}
// F7: Trennzeichen ¬ an der Schreibmarke einfügen (in jedem Eingabefeld). In der Textzeile tut es auch »-« am
// Zeilenende (F7 braucht am Mac die fn-Taste); mitten in der Zeile bleibt »-« ein Bindestrich (Ost-Preußen).
// Endet die Zeile schon mit ¬, setzt »-« einen echten Bindestrich davor: Ost-¬ / Preußen.
document.addEventListener('keydown', e => {
  const el = e.target;
  if (el.tagName != 'INPUT' || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key == 'F7') { e.preventDefault(); el.setRangeText('¬', el.selectionStart, el.selectionEnd, 'end'); }
  else if (e.key == '-' && (el.id == 'edit' || el.id == 'edit2') && el.selectionStart == el.value.length && el.selectionEnd == el.value.length) {
    e.preventDefault();
    if (el.value.endsWith('¬')) el.setRangeText('-', el.value.length - 1, el.value.length - 1, 'end'); else el.setRangeText('¬', el.value.length, el.value.length, 'end');
    el.setSelectionRange(el.value.length, el.value.length);
  } else return;
  el.dispatchEvent(new Event('input'));
}, true);
document.addEventListener('keydown', async e => { if (busy) { e.preventDefault(); return; } busy = true; try { await onKey(e); } finally { busy = false; } });
for (const b of dicBoxes()) b.onchange = async () => { if (!busy) { busy = true; try { await saveDics(); } finally { busy = false; } } };
$('toclink').onclick = async e => { e.preventDefault(); if (mode == 'read' && !busy) { busy = true; try { await openToc(); } finally { busy = false; } } };
$('diclink').onclick = async e => { e.preventDefault(); if (mode == 'read' && !busy) { busy = true; try { await openDics(); } finally { busy = false; } } };
$('notelink').onclick = async e => { e.preventDefault(); if (mode == 'read' && !busy) { busy = true; try { await openNotes(); } finally { busy = false; } } };
// blur: ein Knopf, der den Fokus behält (und am Buchende gesperrt wird), würde die Tasten schlucken
for (const [id, d] of [['pprev', -1], ['pnext', 1]]) $(id).onclick = e => { e.currentTarget.blur(); guarded(() => gotoPage(d))(); };
$('pagesel').onchange = async e => { await loadPage(e.target.value, 0); e.target.blur(); bookmark(); };
$('wfilter').addEventListener('input', () => { if (wl) { wl.sel = 0; renderWl(); } });
window.addEventListener('resize', () => { fitText(); layoutText(); layoutImage(); renderSug(); });
let lastClick = null;
function charOffset(d, x, y) {
  // Zeichenposition in der Zeile unter dem Mauszeiger
  const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
  if (!r || !d.contains(r.startContainer)) return null;
  const r2 = document.createRange(); r2.selectNodeContents(d); r2.setEnd(r.startContainer, r.startOffset);
  return r2.toString().length;
}
$('lines').addEventListener('dblclick', async e => {
  // Doppelklick auf ein Wort: Korrekturmodus mit diesem Wort markiert (Position stammt vom ersten Klick, weil der Text danach rollt)
  const c = lastClick; if (!c || c.off == null) return;
  try { getSelection().removeAllRanges(); } catch (x) {}
  for (let n = 0; n < 80 && busy; n++) await new Promise(r => setTimeout(r, 25));
  if (mode != 'read' || busy || pg != c.p || c.i >= data.lines.length) return;
  li = c.i; const l = data.lines[li]; c.off = rawPos(l, c.off);
  const f = data.flags.find(x => x.line == li && c.off >= x.start && c.off <= x.start + x.len) || data.flags.find(x => isJoin(x) && x.line + 1 == li && c.off >= (x.start2 || 0) && c.off <= (x.start2 || 0) + part2len(x));
  if (f) { enterFix(f); return; }
  let a = c.off, b = c.off; const W = /[A-Za-zÄÖÜäöüß]/;
  if (a > 0 && !W.test(l[a] || '') && W.test(l[a - 1])) { a--; b--; }
  while (a > 0 && W.test(l[a - 1])) a--; while (b < l.length && W.test(l[b])) b++;
  enterFree([a, b]);
});
$('lines').addEventListener('contextmenu', e => {
  // Rechtsklick auf eine markierte Passage: Notiz daraus machen (ohne Markierung bleibt das gewohnte Menü)
  if (mode != 'read' || busy || !selectedText()) return;
  e.preventDefault(); busy = true; makeNote().finally(() => { busy = false; });
});
$('lines').addEventListener('click', async e => {
  if (mode != 'read' || busy || !getSelection().isCollapsed) return;  // nach dem Markieren mit der Maus bleibt die Lesezeile stehen
  const d = e.target.closest('#lines div[data-i]'); if (!d) return;
  if (e.detail <= 1) lastClick = { p: d.dataset.p, i: +d.dataset.i, off: charOffset(d, e.clientX, e.clientY) };
  else return;  // zweiter Klick eines Doppelklicks: der Text ist schon gerollt, nicht nochmal springen
  const i = +d.dataset.i;
  if (d.dataset.p == pg) { if (!skippable(i)) { li = i; msg = ''; render(); bookmark(); } }
  else { busy = true; try { await loadPage(d.dataset.p, i, true); bookmark(); } finally { busy = false; } }
});
function lineInImage(x, y) {
  // Zeile unter einem Punkt im Bildstapel (Bildpixel): die Zeile, deren Kasten ihn enthält, sonst die nächstgelegene – aber
  // höchstens eine Zeilenhöhe entfernt, damit ein Doppelklick auf eine Abbildung oder den leeren Rand nichts verstellt
  const s = imgState; let best = null;
  for (const b of [prevD, data, nextD]) {
    const q = b && b.geo && s.place[b.page]; if (!q) continue;
    const px = x - q.x, py = y - q.y;
    if (py < -IMG_GAP / 2 || py > q.h + IMG_GAP / 2) continue;
    b.geo.forEach((g, i) => {
      if (!g || skippable(i, b)) return;
      const d = Math.hypot(Math.max(0, g.x0 - px, px - g.x1), Math.max(0, g.y0 - py, py - g.y1));
      if (d <= g.y1 - g.y0 && (!best || d < best.d)) best = { page: b.page, i, d };
    });
  }
  return best;
}
$('imgpane').addEventListener('dblclick', async e => {
  // Doppelklick ins Seitenbild: die Zeile unter dem Mauszeiger wird Lesezeile, links wie rechts (#70)

  try { getSelection().removeAllRanges(); } catch (x) {}
  const pane = $('imgpane'), r = pane.getBoundingClientRect(), s = imgState;
  const hit = lineInImage((e.clientX - r.left - pane.clientLeft - s.tx) / s.k, (e.clientY - r.top - pane.clientTop - s.ty) / s.k);
  if (!hit) return;
  if (hit.page == pg) { li = hit.i; msg = ''; render(); bookmark(); }
  else { busy = true; try { await loadPage(hit.page, hit.i, true); bookmark(); } finally { busy = false; } }
});
function onWheel(e) {
  // Strg+Mausrad: über dem Text die Schriftgröße, über dem Bild der Bild-Zoom
  if (e.ctrlKey) { e.preventDefault(); const f = e.deltaY < 0 ? 1.15 : 1 / 1.15; if (e.currentTarget == $('text')) setTextZoom(tzoom * f); else setZoom(zoom * f); return; }
  if (e.shiftKey || e.deltaX) return;  // seitwärts: eine breite Tabelle rollt von selbst (Browser), wir halten uns raus
  // Mausrad: eine Raste = eine Zeile, läuft fließend über Seitengrenzen
  if (mode != 'read') return; e.preventDefault();
  wheelAcc += e.deltaMode == 1 ? e.deltaY * 33 : e.deltaY;
  if (busy) return;
  const n = Math.trunc(wheelAcc / 100); if (!n) return; wheelAcc -= n * 100;
  busy = true; (async () => { try { for (let k = 0; k < Math.min(Math.abs(n), 6); k++) await move(Math.sign(n)); } finally { busy = false; } })();
}
$('text').addEventListener('wheel', onWheel, { passive: false }); $('imgpane').addEventListener('wheel', onWheel, { passive: false });

(async () => {
  await loadOverview();
  let bm = {}; try { bm = await (await fetch(BASE + '/api/bookmark')).json(); } catch (e) {}
  if (!(bm.page && await loadPage(bm.page, bm.line))) { const first = ov.find(o => o.n > 0) || ov[0]; await loadPage(first.page, 0); }
  // Selbsttest: ?keys=Space,Tab,Escape,ArrowDown spielt Tasten ab; "=text" setzt das Eingabefeld
  const ks = new URLSearchParams(location.search).get('keys');
  for (const k of ks ? ks.split(',') : []) {
    if (k.startsWith('=')) $('edit').value = k.slice(1);
    else if (k.startsWith('click:')) $(k.slice(6)).click();  // ein Knopf oder Link der Oberfläche, z. B. click:replPage
    else if (k.startsWith('caret=')) $('edit').setSelectionRange(+k.slice(6), +k.slice(6));
    else if (k.startsWith('imgdbl:')) {  // Doppelklick ins Seitenbild auf die Mitte einer Zeile, z. B. imgdbl:002:1 (Seite, Zeile)
      const [p, i] = k.slice(7).split(':'), g = [prevD, data, nextD].find(b => b && b.page == p).geo[+i], q = imgState.place[p];
      const pane = $('imgpane'), r = pane.getBoundingClientRect(), s = imgState;
      pane.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, clientX: r.left + pane.clientLeft + s.tx + (q.x + (g.x0 + g.x1) / 2) * s.k,
                                                       clientY: r.top + pane.clientTop + s.ty + (q.y + (g.y0 + g.y1) / 2) * s.k }));
    }
    else if (k.startsWith('Shift+') || k.startsWith('Shift ')) (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k.slice(6), shiftKey: true, bubbles: true }));
    else if (k.startsWith('CtrlShift:')) (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k.slice(10), ctrlKey: true, shiftKey: true, bubbles: true }));  // z. B. CtrlShift:* (Strg+Umschalt++)
    else if (k.startsWith('Ctrl+') || k.startsWith('Ctrl ')) (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k.slice(5), ctrlKey: true, bubbles: true }));  // »+« wird in der Adresse zum Leerzeichen
    else if (k.includes('=')) $(k.split('=')[0]).value = k.split('=')[1];
    else (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key: k == 'Space' ? ' ' : k, bubbles: true }));
    await new Promise(r => setTimeout(r, 400));
  }
})();
