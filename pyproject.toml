[project]
name = "fraktur-korrektor"
version = "0.11.0"
description = "Lesen und Korrekturlesen in einem: OCR-Text (Fraktur) neben dem Seitenbild, tastaturgesteuert"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Johannes Wack" }]
requires-python = ">=3.10"
dependencies = ["spylls>=0.1.7", "markdown>=3.4", "pymupdf>=1.23"]
keywords = ["ocr", "fraktur", "proofreading", "transkribus", "tesseract", "digital-humanities"]

[project.optional-dependencies]
dev = ["pytest"]
# Nur zum Bauen der Installer (M4). Der Start mit "python server.py" braucht nichts davon.
build = [
    "pyinstaller>=6.10",
    "pillow>=10",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pefile>=2023.2.7; sys_platform == 'win32'",
]

# Flaches Projekt aus einzelnen Modulen, kein Paket: ohne diese Liste hielte setuptools
# Ordner wie dict/ oder packaging/ für Pakete und bräche die Installation ab.
[tool.setuptools]
py-modules = ["server", "starter", "korrlib", "ocr", "epub", "finder", "pagexml"]

[project.urls]
Homepage = "https://github.com/Josi-create/fraktur-korrektor"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
