<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fraktur-Korrektor</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#e9e6df;color:#222}
#top{display:flex;gap:16px;align-items:center;padding:8px 16px;background:#2b2b2b;color:#eee;font-size:14px}
#top a{color:#ddd} #top .sp{flex:1} #top .langsw b{color:#fff}
#wrap{max-width:1000px;margin:24px auto;padding:0 16px}
h1{font-family:Georgia,serif;font-weight:normal;margin:0 0 4px}
#intro{color:#555;margin-bottom:22px}
button{font:15px Segoe UI,Arial,sans-serif;padding:8px 16px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
button:hover{background:#f4f2ec} button.main{background:#3a6;border-color:#285;color:#fff} button.main:hover{background:#395}
button:disabled{opacity:.5;cursor:default}
#actions{display:flex;gap:12px;align-items:center;margin-bottom:8px} #actions span{color:#666;font-size:14px}
#bOpen{font-size:17px;padding:10px 26px}
#note{color:#a40;font-size:14px;min-height:20px;margin-bottom:10px}
#books{background:#fff;border:1px solid #bbb;border-radius:4px}
.book{padding:12px 18px;border-bottom:1px solid #eee} .book:last-child{border-bottom:0} .book:hover{background:#fff8d8}
.book .line{display:flex;align-items:center;gap:18px}
.book .ti{flex:1;min-width:0;text-decoration:none;color:inherit} .book .ti b{font:20px Georgia,serif;display:block}
.book .ti small{color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book a.ti:hover b{text-decoration:underline}
.book .nr{color:#555;font-size:14px;width:120px;flex:none} .book .nr small{color:#999;display:block}
.book.gone{opacity:.55}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px} .acts .sp{flex:1}
.acts button{font-size:14px;padding:6px 14px} .acts button.weg,.book .line .weg{color:#a40;border-color:#caa;font-size:13.5px;padding:5px 10px}
.acts button.weg:hover,.book .line .weg:hover{background:#fdeaea}
#empty{padding:26px;color:#666;line-height:1.6}
#foot{margin-top:22px;color:#777;font-size:13.5px;display:flex;gap:18px;flex-wrap:wrap} #foot a{color:#456}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
.dlg.on{display:flex}
.dlg form{background:#fff;border-radius:6px;padding:22px 26px;width:700px;max-width:94vw;max-height:92vh;overflow:auto;box-shadow:0 6px 30px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 12px;font:22px Georgia,serif}
.dlg label.f{display:block;margin:14px 0 4px;font-size:14.5px;color:#333}
.dlg input[type=text]{width:100%;box-sizing:border-box;font:15px Consolas,monospace;padding:6px 8px;border:1px solid #999;border-radius:3px}
.dlg .radio{display:flex;gap:26px;flex-wrap:wrap} .dlg .radio label{display:flex;align-items:center;gap:6px;cursor:pointer}
.dlg .row{display:flex;gap:8px} .dlg .row input{flex:1} .dlg .row button{flex:none;padding:5px 10px;font-size:14px}
.dlg .hint{color:#777;font-size:13px;margin-top:10px;line-height:1.5} .dlg .msg{color:#a40;margin-top:12px;min-height:20px;line-height:1.5}
.dlg .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px} .dlg .btns .sp{flex:1}
#pick{display:flex;gap:12px;margin:6px 0 4px} #pick button{flex:1;padding:16px;font-size:16px}
.cand{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid #ccc;border-radius:5px;margin-top:8px;cursor:pointer}
.cand:hover{background:#faf8f2} .cand.sel{border-color:#285;background:#eef7f1;box-shadow:0 0 0 1px #285 inset}
.cand input{margin-top:5px} .cand .ic{font-size:24px;line-height:1.1;width:30px;text-align:center;flex:none}
.cand b{font:17px Georgia,serif} .cand small{display:block;color:#666;font-size:13px;line-height:1.5;word-break:break-all}
.tag{display:inline-block;font:12px Segoe UI,Arial,sans-serif;border-radius:9px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:#e4e0d6;color:#444}
.tag.rec{background:#3a6;color:#fff} .tag.new{background:#e6a700;color:#222} .tag.work{background:#c33;color:#fff}
.tag.gruen{background:#dff0e5;color:#255} .tag.gelb{background:#fbeec4;color:#644} .tag.rot{background:#f8dada;color:#822}
#more{margin-top:10px;font-size:14px} #rest{display:none}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid #ccc;border-radius:5px;margin-top:10px;cursor:pointer;text-decoration:none;color:inherit}
.act:hover{background:#faf8f2;border-color:#285} .act .ic{font-size:24px;line-height:1.1;width:30px;text-align:center;flex:none} .act b{font:17px Georgia,serif;display:block} .act small{color:#666;font-size:13.5px;line-height:1.5;display:block;margin-top:2px}
#einfo{color:#666;font-size:14px;margin-bottom:10px} #einfo small{display:block;word-break:break-all;color:#999}
#ewarn{margin-top:14px;padding:10px 14px;border-left:5px solid #e6a700;background:#fdf6e0;border-radius:0 4px 4px 0;line-height:1.5}
#ewarn .radio{display:block;margin-top:8px} #ewarn .radio label{display:flex;align-items:flex-start;gap:6px;margin-top:4px;cursor:pointer}
#edone h3{margin:0 0 10px;font:19px Georgia,serif;color:#285} #edone .more{margin-top:8px;font-size:14px;color:#555;line-height:1.55}
#eprog{margin-top:14px;display:none} #ebar{height:10px;background:#ddd;border-radius:5px;overflow:hidden} #ebar i{display:block;height:100%;width:0;background:#3a6;transition:width .4s}
#etext{font-size:13.5px;color:#555}
#opts{margin-top:6px} #tl,#pair,#upd{margin-top:12px;padding:8px 12px;background:#eaf5ee;border:1px solid #9c9;border-radius:4px;font-size:14.5px;line-height:1.5}
#tl label,#upd label{display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:4px} #upd.warn{background:#fdf6e0;border-color:#e6a700}
.tools{font-size:14px;line-height:1.7;background:#f6f3ea;border-radius:4px;padding:8px 12px;margin-top:12px} .tools .no{color:#a40} .tools .ok{color:#285}
#empty h2{font:21px Georgia,serif;font-weight:normal;margin:0 0 8px} #empty .tools{max-width:620px}
#prog{margin-top:14px;display:none} #bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden} #bar i{display:block;height:100%;width:0;background:#3a6;transition:width .4s}
#ptext{font-size:13.5px;color:#555}
.amp{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.amp.gruen{background:#3a6} .amp.gelb{background:#e6a700} .amp.rot{background:#c33}
#result{line-height:1.55;margin-top:12px} #result small{color:#666}
#done h3{margin:0 0 10px;font:19px Georgia,serif;color:#285} #done .verdict{font-size:16.5px;margin-bottom:2px} #done small{color:#666}
#done .rec{margin:14px 0 4px;padding:10px 14px;border-left:5px solid #3a6;background:#eef7f1;border-radius:0 4px 4px 0;line-height:1.55}
#done .rec.gelb{border-color:#e6a700;background:#fdf6e0} #done .rec.rot{border-color:#c33;background:#fdeaea} #done .rec b{display:block;margin-bottom:2px}
#done .more{margin-top:10px;font-size:14px;color:#555;line-height:1.55} code{background:#eee;border-radius:3px;padding:0 4px;word-break:break-all}
/* Scans vorbereiten (#42): Empfehlung und Vorschau mit verschiebbarer Trennlinie */
#scanbox{margin-top:12px;padding:10px 14px;border-radius:4px;line-height:1.55;font-size:14.5px}
#scanbox.rec{border-left:5px solid #e6a700;background:#fdf6e0} #scanbox.ok{color:#285;background:#eef7f1} #scanbox b.lbl{display:block;margin-bottom:2px}
#scanbox button{margin-top:8px}
#result .rec{margin-top:4px;padding:10px 14px;border-left:5px solid #3a6;background:#eef7f1;border-radius:0 4px 4px 0;line-height:1.55}
.pv{position:relative;display:inline-block;max-width:100%;margin:10px 0 6px;border:1px solid #bbb;background:#888;cursor:col-resize;user-select:none;touch-action:none}
.pv:focus{outline:2px solid #3a6;outline-offset:2px} .pv img{display:block;max-width:100%;max-height:420px}
.pv .pvline{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#e33;box-shadow:0 0 0 1px #fff;pointer-events:none}
.pv .pvline::before,.pv .pvline::after{content:'';position:absolute;left:-7px;border:8px solid transparent;border-left-color:#e33;border-right-color:#e33;width:1px}
.pv .pvline::before{top:-2px;border-top-color:#e33;border-bottom:0} .pv .pvline::after{bottom:-2px;border-bottom-color:#e33;border-top:0}
.pv .pvbox{position:absolute;border:2px dashed #2a8;box-sizing:border-box;pointer-events:none}
#s4 label,#ebody label.pvopt{display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:4px}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div id="top"><b>Fraktur-Korrektor</b><span class="sp"></span><a data-help="index" target="_blank" data-t="help"></a><span class="langsw"></span></div>
<div id="wrap">
 <h1 data-t="library"></h1>
 <div id="intro" data-t="lib_intro"></div>
 <div id="actions"><button id="bOpen" class="main" data-t="open_btn"></button><span data-t="open_what"></span></div>
 <div id="note"></div>
 <div id="books"></div>
 <div id="foot"><span id="ver"></span><a data-help="index" target="_blank" data-t="help"></a><a data-help="faq" target="_blank" data-t="faq_link"></a><a href="https://github.com/Josi-create/fraktur-korrektor" target="_blank" data-t="source"></a><a id="donate" target="_blank" style="display:none" data-t="donate"></a></div>
</div>
<div id="dlg" class="dlg"><form id="form">
 <h2 data-t="open_title"></h2>
 <div id="s1">
  <div data-t="open_intro"></div>
  <div id="pick"><button type="button" id="cFile">📄 <span data-t="pick_file"></span></button><button type="button" id="cDir">📁 <span data-t="pick_folder"></span></button></div>
  <label class="f" data-t="open_path"></label>
  <div class="row"><input type="text" id="iPath" spellcheck="false"><button type="button" id="bScan" data-t="scan_go"></button></div>
  <div class="hint" data-t="open_hint"></div>
 </div>
 <div id="s2" style="display:none">
  <div id="foundhead"></div>
  <div id="cands"></div>
  <div id="more"><a href="#" id="moreLink"></a></div>
  <div id="rest"></div>
  <div id="opts">
   <div id="pair"></div>
   <div id="tl"><b id="tlinfo"></b>
    <label><input type="radio" name="tl" value="1" checked> <span data-t="tl_use"></span></label>
    <label><input type="radio" name="tl" value=""> <span data-t="tl_redo"></span></label></div>
   <div id="oTitleBox"><label class="f" data-t="imp_name"></label><input type="text" id="oTitle" spellcheck="false"></div>
   <div id="oImgBox"><label class="f" data-t="imp_images"></label>
    <div class="row"><input type="text" id="oImages" spellcheck="false"><button type="button" id="cImg" data-t="choose_folder"></button></div></div>
   <div id="oScriptBox"><label class="f" data-t="ocr_script"></label>
    <div class="radio"><label><input type="radio" name="script" value="fraktur" checked> <span data-t="script_fraktur"></span></label><label><input type="radio" name="script" value="antiqua"> <span data-t="script_antiqua"></span></label></div></div>
   <div id="upd"></div>
   <div id="scanbox" style="display:none"></div>
   <div id="tools" class="tools"></div>
   <div class="hint" id="target"></div>
  </div>
 </div>
 <div id="s4" style="display:none"></div>
 <div id="prog"><div id="bar"><i></i></div><span id="ptext"></span></div>
 <div class="msg" id="omsg"></div>
 <div id="result"></div>
 <div id="done" style="display:none"></div>
 <div class="btns"><button type="button" id="bBack" data-t="back" style="display:none"></button><span class="sp"></span>
  <button type="button" id="oST" data-t="st_button" style="display:none"></button>
  <button type="button" id="bRedo" style="display:none"></button>
  <button type="button" id="oCancel" data-t="cancel"></button><button type="submit" id="oGo" class="main" style="display:none"></button><button type="button" id="bBook" style="display:none"></button></div>
</form></div>
<div id="edlg" class="dlg"><form id="eform">
 <h2 id="etitle"></h2>
 <div id="einfo"></div>
 <div id="ehead"></div>
 <div id="ebody"></div>
 <div id="edone" style="display:none"></div>
 <div id="eprog"><div id="ebar"><i></i></div><span id="etext"></span></div>
 <div class="msg" id="emsg"></div>
 <div class="btns"><button type="button" id="eBack" data-t="back" style="display:none"></button><span class="sp"></span>
  <button type="button" id="eClose" data-t="cancel"></button><button type="submit" id="eGo" class="main" style="display:none"></button>
  <button type="button" id="eBook" data-t="btn_open_book" style="display:none"></button></div>
</form></div>
<script>
const $ = id => document.getElementById(id);
applyI18n();
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
const help = (page, text) => '<a target="_blank" href="/hilfe/' + LANG + '/' + page + '">' + text + '</a>';
// Jede Fehlermeldung endet mit dem Weg zur FAQ – dort stehen die Meldungen mit dem nächsten Schritt (#26)
const fail = (id, err) => { $(id).innerHTML = esc(err.message) + ' ' + help('faq', t('faq_link')); };
const base = p => String(p).split(/[\\/]/).pop();
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(t('err_' + (j.error || 'unknown')));
  return j;
}
let booksdir = '', entered = false;
// Was mit einem Buch möglich ist – in der Reihenfolge, in der es auf der Zeile steht
const BOOKACTS = [['open', b => true], ['pdf', b => true], ['trans', b => true], ['images', b => b.images < b.pages],
                  ['prep_scans', b => b.images > 0], ['prep_trans', b => b.images > 0], ['prep_st', b => b.images > 0],
                  ['restore', b => (b.backups || []).length]];
async function load() {
  const lib = await (await fetch('/api/library')).json();
  $('ver').textContent = lib.version ? 'Version ' + lib.version : '';
  if (lib.donate) { $('donate').href = lib.donate; $('donate').style.display = ''; }
  booksdir = lib.booksdir;
  if (!lib.local) { $('bOpen').disabled = true; $('note').textContent = t('remote'); }
  const edit = (location.hash.startsWith('#edit=') ? location.hash.slice(6) : '').split('|').map(decodeURIComponent);
  const box = $('books'); box.innerHTML = '';
  if (!lib.books.length) { box.innerHTML = '<div id="empty">' + t('empty') + '</div>'; showStart(); return; }
  for (const b of lib.books) {
    const row = document.createElement('div'); row.className = 'book' + (b.pages ? '' : ' gone');
    const ti = b.pages ? ['<a class="ti" href="/buch/' + b.id + '">', '</a>'] : ['<span class="ti">', '</span>'];
    // Jede Möglichkeit bekommt einen beschrifteten Knopf: niemand soll erraten müssen, was hinter einem Zeichen steckt
    const acts = lib.local && b.pages ? BOOKACTS.filter(([k, when]) => when(b)).map(([k]) =>
      '<button class="' + (k == 'open' ? 'main' : '') + '" data-a="' + k + '">' + t(k == 'open' ? 'open_now' : 'act_' + k) + '</button>').join('') +
      '<span class="sp"></span><button class="weg" data-a="forget">' + t('act_forget') + '</button>' : '';
    // Kennzeichen: woher der Text stammt und wie viele Wörter das Wörterbuch nicht kennt
    const tags = (b.quelle || []).map(q => '<span class="tag" title="' + t('src_' + q + '_t') + '">' + t('src_' + q) + '</span>').join('') +
      (b.unknown == null ? '' : '<span class="tag ' + (b.quality || '') + '" title="' + t('tag_unknown_t') + '">' + t('tag_unknown', { n: b.unknown }) + '</span>');
    row.innerHTML = '<div class="line">' + ti[0] + '<b>' + (b.quality ? '<span class="amp ' + b.quality + '" title="' + t('q_dot_' + b.quality) + '"></span>' : '') + esc(b.title) + tags + '</b>' +
      '<small title="' + esc(b.folder) + '">' + esc(b.folder) + '</small>' + ti[1] +
      '<span class="nr">' + (b.pages ? b.pages + ' ' + t('col_pages') + (b.bookmark ? '<small>' + t('col_pos') + ': ' + t('p_abbr') + ' ' + esc(b.bookmark) + '</small>' : '') : t('missing')) + '</span>' +
      '<span class="nr"><small>' + t('col_last') + '</small>' + esc((b.last || '').slice(0, 16)) + '</span>' +
      (lib.local && !b.pages ? '<button class="weg" data-a="forget">' + t('act_forget') + '</button>' : '') + '</div>' +
      (acts ? '<div class="acts">' + acts + '</div>' : '');
    for (const el of row.querySelectorAll('button[data-a]')) el.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const k = el.dataset.a;
      if (k == 'open') return location.href = '/buch/' + b.id;
      if (k != 'forget') return openEdit(b, k);
      if (confirm(t('forget_confirm', { t: b.title }))) { await post('/api/forget', { id: b.id }); load(); }
    };
    box.appendChild(row);
    // Die Wörterbuchquote eines älteren Buchs wird gerade gerechnet – gleich noch einmal nachsehen
    if (b.pending) setTimeout(load, 4000);
    // #edit=<id>|<was> öffnet den Dialog gleich bei der gewünschten Möglichkeit – so verweist die Leseansicht
    // hierher. Ein dritter Teil |<pfad> lässt den Vorgang durchlaufen (Selbsttest). Nur beim ersten Laden:
    // nach dem Einlesen frischt load() die Liste auf und würde sonst von vorn beginnen.
    if (edit[0] == b.id && !entered) {
      entered = true;
      openEdit(b, edit[1] || null);
      if (edit[2] && $('eSrc')) { $('eSrc').value = edit[2]; $('eform').requestSubmit(); }
      else if (edit[2]) eauto = true;  // »Scans vorbereiten« holt erst die Vorschau und läuft dann durch
    }
  }
}

// ---- Erster Start (#19): Ist alles da? Haken statt Fachwörter, und hinter jedem Kreuz der Weg zur Abhilfe
async function showStart() {
  let x; try { x = await (await fetch('/api/tools')).json(); } catch (e) { return; }
  const el = $('empty'); if (!el) return;
  const row = (ok, text, tool) => '<div class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✔ ' : '✘ ') + text +
    (ok || !tool ? '' : ' ' + help('install-tools', t('how_install')) + ' · <a href="#" data-tool="' + tool + '">' + t('show_program') + '</a>') + '</div>';
  el.innerHTML = '<h2>' + t('start_head') + '</h2><div>' + t('start_intro') + '</div><div class="tools">' +
    row(x.dict, t(x.dict ? 'start_dic_ok' : 'start_dic_no')) + row(x.tesseract, t(x.tesseract ? 'tool_tess_ok' : 'start_tess_no'), 'tesseract') +
    row(x.scantailor, t(x.scantailor ? 'tool_st_ok' : 'start_st_no'), 'scantailor') + (x.pdf ? '' : row(false, t('tool_pdf_no'))) +
    '</div><div style="margin-top:14px">' + t('start_next') + ' ' + help('index', t('help')) + '</div>';
  bindToolLinks(el, showStart);
}
function bindToolLinks(box, after) {
  // »Programm zeigen …«: der Nutzer zeigt die Programmdatei, das merkt sich der Fraktur-Korrektor
  for (const a of box.querySelectorAll('a[data-tool]')) a.onclick = async e => {
    e.preventDefault();
    try { const p = (await post('/api/choose', { kind: 'exe' })).path; if (p) { await post('/api/set_tool', { tool: a.dataset.tool, path: p }); await after(); } }
    catch (err) { fail('omsg', err); }
  };
}

// ---- Öffnen: Der Nutzer zeigt eine Datei oder einen Ordner, das Programm findet heraus, was es ist
let job = null, tools = null, found = [], sel = null;
// Ein gesichertes PDF, dessen Buch schon in der Bibliothek liegt: die Kennung des Buchs, wenn es aktualisiert werden soll (#66)
const updChoice = () => { const r = document.querySelector('input[name=upd]:checked'); return sel && sel.kind == 'pdfbuch' && sel.book && r ? r.value : ''; };
const updInto = () => ['update', 'merge'].includes(updChoice()) ? sel.book.id : null;
const AUTO = location.hash.startsWith('#auto=') || location.hash.startsWith('#pair=') || location.hash.split('|').length > 2;
const AUTOPREP = location.hash.startsWith('#scans=');  // Selbsttest: gleich zur Vorschau »Scans vorbereiten«
// Selbsttest #pair=<epub>|<pdf>: das EPUB untersuchen, das PDF dazuholen (wie über den Dateidialog) und einlesen (#40)
const PAIR = location.hash.startsWith('#pair=') ? decodeURIComponent(location.hash.slice(6)).split('|') : null;
const ICON = { book: '📖', pdfbuch: '📕', transkribus: '🗂️', epub: '📗', pdf: '📄', images: '🖼️' };
const usesPdf = f => f && (f.kind == 'pdf' || (f.kind == 'epub' && f.pdf));
const pdfHasText = f => f && (f.kind == 'pdf' ? f.text : f.pdf_text);
// EPUB + PDF: der Wortlaut kommt ohnehin aus dem EPUB – die Textebene des PDF dient nur den Zeilenpositionen, also nicht nachfragen
const useText = () => usesPdf(sel) && pdfHasText(sel) && (sel.kind == 'epub' || document.querySelector('input[name=tl]:checked').value == '1');
const needsOcr = () => sel && (sel.kind == 'images' || (usesPdf(sel) && !useText()));

let stepNow = 1;
function step(n) {  // 1 zeigen · 2 Funde und Optionen · 3 fertig · 4 Vorschau »Scans vorbereiten«
  stepNow = n;
  $('s1').style.display = n == 1 ? '' : 'none'; $('s2').style.display = n == 2 ? '' : 'none'; $('done').style.display = n == 3 ? '' : 'none';
  $('s4').style.display = n == 4 ? '' : 'none'; if (n != 4) $('s4').innerHTML = '';

    boxes.map(b => '<div class="pvbox" style="left:' + b[0] * 100 + '%;top:' + b[1] * 100 + '%;width:' + (b[2] - b[0]) * 100 + '%;height:' + (b[3] - b[1]) * 100 + '%"></div>').join('') + '<div class="pvline"></div></div>' +
    '<label class="pvopt"><input type="checkbox" class="pvSplit"' + (r.double ? ' checked' : '') + '> ' + t('scans_split') + '</label>' +
    '<label class="pvopt"><input type="checkbox" class="pvDeskew"' + (skew ? ' checked' : '') + '> ' + t('scans_deskew') + (skew ? t('scans_deskew_a', { a: fmtDeg(r.skew) }) : '') + '</label>' +
    '<label class="pvopt"><input type="checkbox" class="pvCrop"' + (r.margins ? ' checked' : '') + '> ' + t('scans_crop') + (boxes.length ? t('scans_crop_box') : '') + '</label>' +
    '<div class="hint">' + t('scans_pages', { n: r.pages }) + '</div>';
  const area = box.querySelector('.pv'), line = box.querySelector('.pvline'), cbS = box.querySelector('.pvSplit'), cbD = box.querySelector('.pvDeskew'), cbC = box.querySelector('.pvCrop');
  const st = { pos: r.split || 0.5, get split() { return cbS.checked ? this.pos : null; }, get deskew() { return cbD.checked; }, get crop() { return cbC.checked; } };
  const draw = () => {
    line.style.left = (st.pos * 100) + '%'; line.style.display = cbS.checked ? '' : 'none';
    for (const b of box.querySelectorAll('.pvbox')) b.style.display = cbC.checked ? '' : 'none';
  };
  const setPos = x => { st.pos = Math.min(0.9, Math.max(0.1, x)); draw(); };
  const at = ev => { const b = area.getBoundingClientRect(); return (ev.clientX - b.left) / b.width; };
  let down = false;
  area.onpointerdown = ev => { if (!cbS.checked) return; down = true; area.setPointerCapture(ev.pointerId); setPos(at(ev)); area.focus(); };
  area.onpointermove = ev => { if (down) setPos(at(ev)); };
  area.onpointerup = area.onpointercancel = () => { down = false; };
  area.onkeydown = ev => {
    const d = ev.key == 'ArrowLeft' ? -1 : ev.key == 'ArrowRight' ? 1 : 0; if (!d || !cbS.checked) return;
    ev.preventDefault(); setPos(st.pos + d * (ev.shiftKey ? 0.02 : 0.004));
  };
  cbS.onchange = cbC.onchange = draw; draw(); area.focus();
  return st;
}
async function runPrepare() {
  // Der Auftrag schreibt die vorbereiteten Seiten in einen eigenen Ordner; danach wird der gleich untersucht,
  // damit »Texterkennung starten« als Nächstes bereitsteht – wie nach ScanTailor, nur ohne den Umweg.
  const src = sel.path, title = $('oTitle').value.trim(), o = pv;
  try {
    const r = await runJob('/api/prepare_scans', { source: src, title, split: o.split, deskew: o.deskew, crop: o.crop });
    $('iPath').value = r.folder; await doScan();
    $('result').innerHTML = '<div class="rec">✔ ' + t('scans_done', { n: r.pages, s: r.split, r: r.rotated, c: r.trimmed, folder: esc(r.folder) }) + '<br>' + t('scans_next') + '</div>';
  } catch (err) { fail('omsg', err); }
}
$('oST').onclick = async () => {
  try {
    const r = await runJob('/api/scantailor', { source: sel.path, title: $('oTitle').value.trim() });
    const clip = r.clipboard ? '<p>' + t('st_clip', { keys: t(/Mac/i.test(navigator.platform) ? 'paste_mac' : 'paste') }) + '</p>' : '';
    $('result').innerHTML = r.folder ? t('st_done', { folder: esc(r.folder), out: esc(r.out) }) + clip + ' ' + help('pdf-import', t('q_ends_link')) : t('st_started');
    if (r.out) $('iPath').value = r.out;
  } catch (err) { fail('omsg', err); }
};
// ---- Ein Buch weiterbearbeiten: Text aus Transkribus nachlegen, Bilder ergänzen, die anderen Programme vorbereiten.
// Wer sein Buch schon einmal eingelesen hat, soll nicht wieder von vorn anfangen – und seine Seitenbilder nicht suchen müssen.
let eb = null, eact = null, enext = null, enextOpen = null, epv = null, eauto = false;
const ACTS = { pdf: ['📕', b => true], trans: ['🗂️', b => true], addpdf: ['📄', b => b.textbook], images: ['🖼️', b => b.images < b.pages && !b.textbook],
               prep_scans: ['✂️', b => b.images > 0], prep_trans: ['⬆️', b => b.images > 0], prep_st: ['🧹', b => b.images > 0],
               restore: ['⏪', b => (b.backups || []).length] };

function openEdit(b, act) {
  eb = b; enext = enextOpen = null;
  $('edlg').classList.add('on');
  $('etitle').textContent = b.title;
  const d = [t('ed_pages', { n: b.pages }),
    b.images >= b.pages ? t('ed_imgs') : b.images ? t('ed_someimgs', { n: b.images, p: b.pages }) : t('ed_noimgs')];
  if (b.corrections) d.push(t('ed_corr', { n: b.corrections }));
  $('einfo').innerHTML = esc(d.join(' · ')) + '<small>' + esc(b.folder) + '</small>';
  editPick();
  if (act) editAct(act);
}
function editPick() {
  eact = null; $('emsg').textContent = ''; $('ehead').textContent = t('ed_what');
  $('ebody').style.display = ''; $('edone').style.display = 'none';
  $('eBack').style.display = $('eGo').style.display = $('eBook').style.display = 'none';
  $('eClose').textContent = t('cancel');
  $('ebody').innerHTML = Object.keys(ACTS).filter(k => ACTS[k][1](eb)).map(k =>
    '<a href="#" class="act" data-a="' + k + '"><span class="ic">' + ACTS[k][0] + '</span><span><b>' + t('act_' + k) + '</b><small>' + t('act_' + k + '_hint') + '</small></span></a>').join('');
  for (const el of $('ebody').querySelectorAll('a[data-a]')) el.onclick = ev => { ev.preventDefault(); editAct(el.dataset.a); };
}
function editAct(a) {
  eact = a; $('emsg').textContent = ''; $('eBack').style.display = ''; $('ehead').innerHTML = '<b>' + t('act_' + a) + '</b>';
  if (a == 'prep_trans' || a == 'prep_st') return editPrepare(a);
  if (a == 'prep_scans') return editScans();
  if (a == 'restore') return editRestore();
  if (a == 'pdf') return editPdf();
  if (a == 'addpdf') return editAddPdf();
  const img = a == 'images';
  $('ebody').innerHTML = '<label class="f">' + t(img ? 'ed_imgsource' : 'ed_source') + '</label>' +
    '<div class="row"><input type="text" id="eSrc" spellcheck="false">' +
    '<button type="button" id="eFile">📄 ' + t('pick_file') + '</button>' +
    '<button type="button" id="eDir">📁 ' + t('pick_folder') + '</button></div>' +
    (!img && eb.corrections ? '<div id="ewarn">' + t('ed_warn_corr', { n: eb.corrections }) +
      '<div class="radio"><label><input type="radio" name="emode" value="replace" checked> ' + t('ed_mode_replace') + '</label>' +
      '<label><input type="radio" name="emode" value="new"> ' + t('ed_mode_new') + '</label></div></div>' : '');
  $('eFile').onclick = () => editChoose(img ? 'pdf' : 'export');
  $('eDir').onclick = () => editChoose('folder');
  $('eGo').style.display = ''; $('eGo').disabled = false; $('eGo').textContent = t(img ? 'ed_take_imgs' : 'ed_take');
  $('eSrc').focus();
}
function editPdf() {
  // Das PDF kommt neben den Buchordner; wer es gleich auf einen Stick will, wählt einen anderen Ordner
  $('ebody').innerHTML = '<div>' + t('ed_pdf_intro') + '</div><label class="f">' + t('ed_pdf_target') + '</label>' +
    '<div class="row"><input type="text" id="eSrc" spellcheck="false"><button type="button" id="eDir">📁 ' + t('pick_folder') + '</button></div>' +
    '<div class="hint">' + t('ed_pdf_hint') + ' ' + help('pdf-sichern', t('help')) + '</div>';
  $('eSrc').value = eb.pdfdir || '';
  $('eDir').onclick = () => editChoose('folder');
  $('eGo').style.display = ''; $('eGo').disabled = false; $('eGo').textContent = t('ed_pdf_go');
}
function editAddPdf() {
  // Textbuch aus einem EPUB ohne PDF (#40): der Scan kommt nachträglich dazu. Es entsteht ein neues Buch – die Seiten des
  // Textbuchs sind willkürlich umbrochen, Protokoll und Lesezeichen gehören zu ihnen –, der korrigierte Text kommt mit
  $('ebody').innerHTML = '<div>' + t('ed_addpdf_intro') + '</div><label class="f">' + t('ed_addpdf_source') + '</label>' +
    '<div class="row"><input type="text" id="eSrc" spellcheck="false"><button type="button" id="eFile">📄 ' + t('choose_pdf') + '</button></div>' +
    '<div class="msg" id="efit"></div>' +
    '<label class="f">' + t('ocr_script') + '</label><div class="radio"><label><input type="radio" name="script" value="fraktur" checked> ' + t('script_fraktur') +
    '</label><label><input type="radio" name="script" value="antiqua"> ' + t('script_antiqua') + '</label></div>' +
    '<div class="hint">' + t('ed_addpdf_hint') + '</div>';
  const check = async () => {  // gleich nachsehen, ob das PDF zu diesem Text gehört
    const p = $('eSrc').value.trim(); $('efit').textContent = ''; $('eGo').disabled = !p; if (!p) return;
    try {
      const r = await post('/api/epub_pair', { id: eb.id, pdf: p });
      $('efit').innerHTML = r.fit == null ? t('pair_fit_unknown') : t('pair_fit_ok', { p: Math.round(r.fit * 100) });
    } catch (err) { fail('efit', err); $('eGo').disabled = true; }
  };
  $('eFile').onclick = async () => { await editChoose('pdf'); check(); };
  $('eSrc').addEventListener('change', check);
  $('eGo').style.display = ''; $('eGo').disabled = true; $('eGo').textContent = t('ed_addpdf_go');
  $('eSrc').focus();
}
async function editRestore() {
  // Jede ersetzte Fassung liegt als vorher-<Datum>.zip im Buchordner – von hier aus lässt sie sich zurückholen
  $('eGo').style.display = 'none';
  $('ebody').innerHTML = '<div>' + t('ed_restore_pick') + '</div>' + (eb.backups || []).map((b, n) =>
    '<a href="#" class="act" data-b="' + n + '"><span class="ic">⏪</span><span><b>' + esc(b.zeit) + '</b><small>' +
    t('ed_restore_item', { n: b.pages }) + ' · ' + esc(b.name) + '</small></span></a>').join('');
  for (const el of $('ebody').querySelectorAll('a[data-b]')) el.onclick = async ev => {
    ev.preventDefault();
    const b = eb.backups[+el.dataset.b];
    try {
      const r = await post('/api/restore', { id: eb.id, name: b.name });
      enext = eb.id;
      editDone('<h3>✔ ' + t('ed_restore_done', { d: esc(b.zeit), n: r.back }) + '</h3>' +
        (r.backup ? '<div class="hint">' + t('ed_backup', { f: esc(r.backup) }) + '</div>' : ''));
      load();
    } catch (err) { fail('emsg', err); }
  };
}
async function editScans() {
  // Die Seitenbilder des Buchs vorbereiten; das Ergebnis wird danach als neues Buch erkannt
  const src = eb.folder + '/img';
  $('ebody').innerHTML = '<div>' + t('scans_checking') + '</div>'; $('eGo').style.display = 'none';
  try {
    const r = await post('/api/scans_check', { source: src });
    if (eact != 'prep_scans') return;
    epv = scanPreview($('ebody'), src, r);
    $('eGo').style.display = ''; $('eGo').disabled = false; $('eGo').textContent = t('scans_go');
    if (eauto) { eauto = false; $('eform').requestSubmit(); }
  } catch (err) { fail('emsg', err); }
}
async function editChoose(kind) {
  try { const p = (await post('/api/choose', { kind })).path; if (p) $('eSrc').value = p; }
  catch (err) { fail('emsg', err); }
}
async function editPrepare(a) {
  $('ebody').innerHTML = ''; $('eGo').style.display = 'none';
  try {
    const r = await post('/api/prepare', { id: eb.id, tool: a == 'prep_st' ? 'scantailor' : 'transkribus' });
    let h = '<p>' + t(a == 'prep_st' ? 'ed_prep_st_done' : 'ed_prep_trans_done', { n: r.pages }) + '</p><p><code>' + esc(r.folder) + '</code></p>';
    if (r.out) h += '<p>' + t('ed_prep_st_out') + '</p><p><code>' + esc(r.out) + '</code></p>';
    if (r.clipboard) h += '<div class="hint">' + t('ed_clip', { keys: t(/Mac/i.test(navigator.platform) ? 'paste_mac' : 'paste') }) + '</div>';
    $('ebody').innerHTML = h + '<div class="hint">' + (a == 'prep_st' ? t('ed_prep_after') : help('transkribus', t('q_advice_link'))) + '</div>';
  } catch (err) { fail('emsg', err); }
}
async function editJob(path, body) {
  $('eprog').style.display = 'block'; $('eGo').disabled = true; $('ebar').firstChild.style.width = '0';
  try {
    const id = (await post(path, body)).job;
    while (true) {
      if (!AUTO) await new Promise(r => setTimeout(r, 400));  // Selbsttest: ohne Pause, siehe runJob
      const j = await (await fetch('/api/job/' + id)).json();
      if (j.total) $('ebar').firstChild.style.width = (100 * j.done / j.total) + '%';
      $('etext').textContent = j.msg ? t('prog_' + j.msg, { d: j.done, t: j.total }) : '';
      if (j.state == 'done') return j.result;
      if (j.state == 'error') throw new Error(t('err_' + j.error));
    }
  } finally { $('eprog').style.display = 'none'; $('eGo').disabled = false; }
}
function editDone(h) {
  $('ebody').style.display = 'none'; $('ehead').textContent = '';
  $('eGo').style.display = $('eBack').style.display = 'none';
  $('edone').style.display = ''; $('edone').innerHTML = h;
  $('eBook').style.display = ''; $('eBook').className = 'main'; $('eBook').textContent = t('btn_open_book'); $('eClose').textContent = t('close');
}
$('eform').onsubmit = async ev => {
  ev.preventDefault();
  const src = $('eSrc') ? $('eSrc').value.trim() : '';
  if (!src && eact != 'pdf' && eact != 'prep_scans') return;
  const mode = document.querySelector('input[name=emode]:checked');
  try {
    if (eact == 'prep_scans') {
      const r = await editJob('/api/prepare_scans', { source: eb.folder + '/img', split: epv.split, deskew: epv.deskew, crop: epv.crop });
      enextOpen = r.folder;
      editDone('<h3>✔ ' + t('act_prep_scans') + '</h3><p>' + t('scans_done', { n: r.pages, s: r.split, r: r.rotated, c: r.trimmed, folder: esc(r.folder) }) + '</p>' +
        '<div class="hint">' + t('scans_ed_next') + '</div>');
      $('eBook').textContent = t('scans_ed_go');
    } else if (eact == 'pdf') {
      const r = await editJob('/api/export_pdf', { id: eb.id, target: src });
      enext = eb.id;
      editDone('<h3>✔ ' + t('ed_pdf_done', { n: r.pages, s: r.size >= 1048576 ? (r.size / 1048576).toFixed(1) + ' MB' : Math.round(r.size / 1024) + ' KB' }) + '</h3><p><code>' + esc(r.file) + '</code> ' +
        '<a href="#" id="showPdf">' + t('btn_show_folder') + '</a> <span id="shownPdf"></span></p>' +
        '<div class="hint">' + t('ed_pdf_inside', { n: r.corrections }) + '</div><div class="hint">' + t('ed_pdf_other') + '</div>');
      $('showPdf').onclick = async ev => {
        ev.preventDefault();
        try { await post('/api/reveal', { path: r.folder }); $('shownPdf').textContent = t('shown_clip'); }
        catch (err) { fail('shownPdf', err); }
      };
    } else if (eact == 'addpdf') {
      const script = document.querySelector('#ebody input[name=script]:checked');
      const r = await editJob('/api/add_pdf', { id: eb.id, source: src, script: script ? script.value : 'fraktur' });
      enext = r.id;
      editDone('<h3>✔ ' + t('ed_addpdf_done', { n: r.pages, m: Math.round(r.matched * 100) }) + '</h3>' +
        '<div class="hint">' + t('ed_addpdf_new', { f: esc(r.folder) }) + '</div>');
    } else if (eact == 'images') {
      const r = await editJob('/api/add_images', { id: eb.id, source: src });
      enext = eb.id;
      editDone('<h3>✔ ' + t('ed_done_imgs', { n: r.added }) + '</h3><div class="hint">' + t('ed_how_' + r.how) + '</div>');
    } else {
      // Ein neues Buch entsteht als Kopie des alten (mit seinen Seitenbildern) – derselbe Weg hinein
      const r = await editJob('/api/add_transkribus', { id: eb.id, source: src, mode: mode ? mode.value : 'replace' });
      enext = r.id;
      let h = '<h3>✔ ' + t('ed_done_trans', { r: r.replaced, p: r.pages }) + '</h3>';
      if (r.neu) h += '<div class="hint">' + t('ed_new_book', { f: esc(r.folder) }) + '</div>';
      if (r.kept && r.kept.length) h += '<div class="hint">' + t('ed_kept', { p: r.kept.join(', ') }) + '</div>';
      if (r.unclear) h += '<div class="hint">' + t('ed_unclear', { n: r.unclear }) + '</div>';
      if (r.nogeo && r.nogeo.length) h += '<div class="hint">' + t('ed_nogeo', { n: r.nogeo.length }) + '</div>';
      h += '<div class="hint">' + t('ed_how_' + r.how) + '</div>';
      if (r.backup) h += '<div class="hint">' + t('ed_backup', { f: esc(r.backup) }) + '</div>';
      editDone(h);
    }
    load();
  } catch (err) { fail('emsg', err); }
};
$('eBack').onclick = () => editPick();
$('eBook').onclick = () => {
  if (enextOpen) { $('edlg').classList.remove('on'); openDialog(enextOpen); }  // die vorbereiteten Seiten gleich erkennen lassen
  else if (enext) location.href = '/buch/' + enext;
};
$('eClose').onclick = () => $('edlg').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key == 'Escape' && !job) { $('dlg').classList.remove('on'); $('edlg').classList.remove('on'); } if (e.key == 'F1') { e.preventDefault(); window.open('/hilfe/' + LANG + '/index', '_blank'); } });
load();
// Einstieg aus der Hilfe: #open bzw. #open=<pfad>; #auto=<pfad> liest die Empfehlung gleich ein, #scans=<pfad> zeigt die
// Vorschau »Scans vorbereiten« (Selbsttest, wie ?keys im Reader)
if (location.hash.startsWith('#open') || AUTO || AUTOPREP) openDialog(PAIR ? PAIR[0] : location.hash.includes('=') ? decodeURIComponent(location.hash.split('=').slice(1).join('=')) : '');
</script>
