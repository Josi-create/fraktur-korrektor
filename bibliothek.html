<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fraktur-Korrektor</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#e9e6df;color:#222}
#top{display:flex;gap:16px;align-items:center;padding:8px 16px;background:#2b2b2b;color:#eee;font-size:14px}
#top a{color:#ddd} #top .sp{flex:1} #top .langsw b{color:#fff}
#wrap{max-width:1000px;margin:24px auto;padding:0 16px}
h1{font-family:Georgia,serif;font-weight:normal;margin:0 0 4px}
#intro{color:#555;margin-bottom:22px}
button{font:15px Segoe UI,Arial,sans-serif;padding:8px 16px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
button:hover{background:#f4f2ec} button.main{background:#3a6;border-color:#285;color:#fff} button.main:hover{background:#395}
button:disabled{opacity:.5;cursor:default}
#actions{display:flex;gap:12px;margin-bottom:8px}
#note{color:#a40;font-size:14px;min-height:20px;margin-bottom:10px}
#books{background:#fff;border:1px solid #bbb;border-radius:4px}
.book{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid #eee;cursor:pointer;text-decoration:none;color:inherit}
.book:last-child{border-bottom:0} .book:hover{background:#fff8d8}
.book .ti{flex:1;min-width:0} .book .ti b{font:20px Georgia,serif;display:block}
.book .ti small{color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .nr{color:#555;font-size:14px;width:120px;flex:none} .book .nr small{color:#999;display:block}
.book.gone{cursor:default;opacity:.55} .book .x{border:0;background:none;color:#999;font-size:18px;padding:4px 8px} .book .x:hover{color:#c00;background:none}
#empty{padding:26px;color:#666;line-height:1.6}
#foot{margin-top:22px;color:#777;font-size:13.5px;display:flex;gap:18px;flex-wrap:wrap} #foot a{color:#456}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#dlg.on{display:flex}
#dlg form{background:#fff;border-radius:6px;padding:22px 26px;width:640px;max-width:92vw;box-shadow:0 6px 30px rgba(0,0,0,.3)}
#dlg h2{margin:0 0 14px;font:22px Georgia,serif}
#dlg label{display:block;margin:14px 0 4px;font-size:14.5px;color:#333}
#dlg input{width:100%;box-sizing:border-box;font:15px Consolas,monospace;padding:6px 8px;border:1px solid #999;border-radius:3px}
#dlg .row{display:flex;gap:8px} #dlg .row input{flex:1} #dlg .row button{flex:none;padding:5px 10px;font-size:14px}
#dlg .hint{color:#777;font-size:13px;margin-top:12px} #dlg .msg{color:#a40;margin-top:12px;min-height:20px;line-height:1.5}
#dlg .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div id="top"><b>Fraktur-Korrektor</b><span class="sp"></span><a data-help="index" target="_blank" data-t="help"></a><span class="langsw"></span></div>
<div id="wrap">
 <h1 data-t="library"></h1>
 <div id="intro" data-t="lib_intro"></div>
 <div id="actions">
  <button id="bOpen" class="main" data-t="open_folder"></button>
  <button id="bImport" data-t="import_tk"></button>
 </div>
 <div id="note"></div>
 <div id="books"></div>
 <div id="foot"><span id="ver"></span><a data-help="index" target="_blank" data-t="help"></a><a href="https://github.com/Josi-create/fraktur-korrektor" target="_blank" data-t="source"></a><a id="donate" target="_blank" style="display:none" data-t="donate"></a></div>
</div>
<div id="dlg"><form id="form">
 <h2 data-t="imp_title"></h2>
 <label data-t="imp_source"></label>
 <div class="row"><input id="iSource" spellcheck="false"><button type="button" id="cZip" data-t="choose_zip"></button><button type="button" id="cDir" data-t="choose_folder"></button></div>
 <label data-t="imp_name"></label>
 <input id="iTitle" spellcheck="false" data-t-ph="imp_name_ph">
 <label data-t="imp_images"></label>
 <div class="row"><input id="iImages" spellcheck="false"><button type="button" id="cImg" data-t="choose_folder"></button></div>
 <div class="hint" id="target"></div>
 <div class="msg" id="imsg"></div>
 <div class="btns"><button type="button" id="bCancel" data-t="cancel"></button><button type="submit" id="bGo" class="main" data-t="imp_go"></button></div>
</form></div>
<script>
const $ = id => document.getElementById(id);
applyI18n();
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(t('err_' + (j.error || 'unknown')));
  return j;
}
async function load() {
  const lib = await (await fetch('/api/library')).json();
  $('ver').textContent = lib.version ? 'Version ' + lib.version : '';
  if (lib.donate) { $('donate').href = lib.donate; $('donate').style.display = ''; }
  $('target').textContent = t('imp_target', { dir: lib.booksdir });
  if (!lib.local) { $('bOpen').disabled = $('bImport').disabled = true; $('note').textContent = t('remote'); }
  const box = $('books'); box.innerHTML = '';
  if (!lib.books.length) { box.innerHTML = '<div id="empty">' + t('empty') + '</div>'; return; }
  for (const b of lib.books) {
    const a = document.createElement(b.pages ? 'a' : 'div'); a.className = 'book' + (b.pages ? '' : ' gone'); if (b.pages) a.href = '/buch/' + b.id;
    a.innerHTML = '<span class="ti"><b>' + esc(b.title) + '</b><small title="' + esc(b.folder) + '">' + esc(b.folder) + '</small></span>' +
      '<span class="nr">' + (b.pages ? b.pages + ' ' + t('col_pages') + (b.bookmark ? '<small>' + t('col_pos') + ': ' + t('p_abbr') + ' ' + esc(b.bookmark) + '</small>' : '') : t('missing')) + '</span>' +
      '<span class="nr"><small>' + t('col_last') + '</small>' + esc((b.last || '').slice(0, 16)) + '</span>' +
      (lib.local ? '<button class="x" title="' + t('forget') + '">✕</button>' : '');
    const x = a.querySelector('.x');
    if (x) x.onclick = async e => { e.preventDefault(); e.stopPropagation(); if (confirm(t('forget_confirm', { t: b.title }))) { await post('/api/forget', { id: b.id }); load(); } };
    box.appendChild(a);
  }
}
async function choose(kind, input) {
  const r = await post('/api/choose', { kind }); if (r.path) { input.value = r.path; input.dispatchEvent(new Event('change')); }
}
$('bOpen').onclick = async () => {
  $('note').textContent = '';
  try {
    let p = (await post('/api/choose', { kind: 'folder' })).path;
    if (!p) return;
    const r = await post('/api/open', { folder: p }); location.href = '/buch/' + r.id;
  } catch (e) { $('note').textContent = e.message; }
};
$('bImport').onclick = () => { $('imsg').textContent = ''; $('dlg').classList.add('on'); $('iSource').focus(); };
$('bCancel').onclick = () => $('dlg').classList.remove('on');
$('cZip').onclick = () => choose('zip', $('iSource'));
$('cDir').onclick = () => choose('folder', $('iSource'));
$('cImg').onclick = () => choose('folder', $('iImages'));
$('form').onsubmit = async e => {
  e.preventDefault();
  $('bGo').disabled = true; $('imsg').textContent = t('importing');
  try {
    const r = await post('/api/import_transkribus', { source: $('iSource').value.trim(), title: $('iTitle').value.trim(), images: $('iImages').value.trim() });
    $('imsg').innerHTML = esc(t('imp_done', { n: r.pages, i: r.images })) + r.warnings.map(w => '<br>' + esc(t('warn_' + w))).join('') +
      '<br><br><a href="/buch/' + r.id + '"><b>' + t('open_now') + ' →</b></a>';
    load();
  } catch (err) { $('imsg').textContent = err.message; }
  $('bGo').disabled = false;
};
document.addEventListener('keydown', e => { if (e.key == 'Escape') $('dlg').classList.remove('on'); if (e.key == 'F1') { e.preventDefault(); window.open('/hilfe/' + LANG + '/index', '_blank'); } });
load();
</script>
</body>
</html>
